<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* DuPage Quotes – contractor dashboard v2 ("very modern")
   Colors come from the contractor (--g brand, --a accent); everything else is neutral. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#1F4D3A;--a:#C8892B;--ink:#0f1115;--mute:#6b7079;--line:rgba(15,17,21,.07);
  --bg:color-mix(in srgb,var(--g) 4%,#f6f6f7);--card:#fff;
  --ease:cubic-bezier(.23,1,.32,1);--spring:cubic-bezier(.34,1.4,.64,1);
  --sh:0 1px 2px rgba(15,17,21,.04),0 4px 12px rgba(15,17,21,.04),0 16px 32px -12px rgba(15,17,21,.08);
  --tint:color-mix(in srgb,var(--g) 9%,white);--tint2:color-mix(in srgb,var(--g) 16%,white)}
html{background:var(--bg)}
body{margin:0;background:var(--bg);font-family:Inter,-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";letter-spacing:-.006em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 20px 86px;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--a) 55%,transparent) 0%,transparent 55%),
             radial-gradient(90% 80% at 0% 100%,color-mix(in srgb,var(--g) 40%,black) 0%,transparent 60%),var(--g)}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:18px 18px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);-webkit-mask-image:linear-gradient(to bottom,black,transparent 85%)}
.wrap{max-width:1040px;margin:0 auto;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.02em;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 11px;border-radius:99px}
.pill i{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  color:#fff;cursor:pointer;transition:transform .16s var(--ease),background .2s}
.iconbtn:active{transform:scale(.92)}.iconbtn.spin svg{animation:spin .8s var(--ease)}@keyframes spin{to{transform:rotate(360deg)}}
.id{display:flex;align-items:center;gap:14px;margin-top:26px}
#logo{flex:none;width:60px;height:60px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#logo img{max-width:52px;max-height:52px;object-fit:contain}#logo b{color:var(--g);font-size:22px;font-weight:800}
.hi{font-size:13px;opacity:.78;font-weight:500}
h1{margin:2px 0 0;font-size:clamp(24px,6.4vw,34px);line-height:1.08;font-weight:700;letter-spacing:-.03em}
.date{margin-top:16px;font-size:13.5px;opacity:.8}
/* ---------- main ---------- */
main{max-width:1040px;margin:-62px auto 0;padding:0 14px calc(env(safe-area-inset-bottom) + 30px);position:relative}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border-radius:20px;padding:14px 15px 15px;box-shadow:var(--sh);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .l svg{width:15px;height:15px;color:var(--g)}
.kpi b{display:block;font-size:28px;font-weight:700;margin-top:6px;color:var(--ink);line-height:1.05}
.kpi small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.kpi.hl{background:linear-gradient(160deg,var(--g),color-mix(in srgb,var(--g) 70%,black));color:#fff;border-color:transparent}
.kpi.hl .l,.kpi.hl small{color:rgba(255,255,255,.75)}.kpi.hl b{color:#fff}.kpi.hl .l svg{color:#fff}
.seg{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:5;margin:18px 0 12px;display:grid;grid-template-columns:repeat(3,1fr);
  background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  border:1px solid var(--line);border-radius:16px;padding:4px;box-shadow:0 6px 20px -10px rgba(15,17,21,.18)}
.seg button{position:relative;z-index:1;border:0;background:none;font:600 13.5px/1 Inter,-apple-system,sans-serif;color:var(--mute);padding:11px 4px;border-radius:12px;cursor:pointer;transition:color .25s}
.seg button.on{color:var(--ink)}
.seg button em{font-style:normal;font-size:11px;font-weight:700;margin-left:5px;padding:2px 6px;border-radius:99px;background:var(--tint);color:var(--g)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.07);transition:transform .45s var(--spring)}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.panel{display:none}.panel.on{display:block;animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:6px 16px;box-shadow:var(--sh);border:1px solid var(--line)}
.card+.card{margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px}
.ch h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}.ch span{font-size:12px;color:var(--mute)}
/* schedule timeline */
.job{display:grid;grid-template-columns:54px 1fr;gap:13px;padding:13px 0;border-top:1px solid var(--line);position:relative}
.ch+.job{border-top:0}
.day{align-self:start;border-radius:16px;text-align:center;padding:7px 0 8px;background:var(--tint);color:var(--g)}
.day small{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.day b{display:block;font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.day.nd{min-height:62px;background:#f1f1f3;color:#8b8f97;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;line-height:1.3}
.day.soon{background:var(--g);color:#fff}
.job .t{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
.job .t .num{font-weight:700}
.job .p{color:#3a3e45;font-size:14px;margin-top:1px}
.job .m{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag.ok{background:color-mix(in srgb,#16a34a 12%,white);color:#15803d}
.tag.br{background:var(--tint);color:var(--g)}
.tag.wait{background:#fff4e0;color:#a15c00}.tag.hot{background:#fee9e7;color:#b42318}
a.go{display:inline-flex;align-items:center;gap:4px;color:var(--g);font-weight:600;font-size:12.5px;text-decoration:none;padding:3px 0}
/* lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .16s var(--ease)}
.ch+.row,.row:first-child{border-top:0}.row:active{transform:scale(.985)}
.av{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--tint);color:var(--g)}
.row .mid{flex:1;min-width:0}.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}.row .r .num{font-weight:700;font-size:15px}.row .r .tag{margin-top:4px}
.chev{color:#c3c6cc;flex:none}
.empty{color:var(--mute);font-size:14px;padding:18px 0 20px;text-align:center}
.empty b{display:block;font-size:28px;margin-bottom:4px}
/* month */
.ring{display:flex;align-items:center;gap:16px;padding:12px 0 6px}
.ring svg{flex:none}.ring .bg{stroke:var(--tint2)}.ring .fg{stroke:var(--g);transition:stroke-dashoffset 1.2s var(--ease)}
.ring b{font-size:24px;font-weight:700}.ring small{display:block;color:var(--mute);font-size:12.5px}
.ml div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ml div span:first-child{color:var(--mute)}.ml div span:last-child{font-weight:600}
.ml .bill{font-weight:700}.ml .bill span:last-child{color:var(--g);font-size:16px}
footer{text-align:center;font-size:12px;color:#9a9ea6;margin:26px 16px calc(env(safe-area-inset-bottom) + 30px)}
footer b{color:#6b7079;font-weight:600}
/* entrance */
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + var(--d0,0ms))}
body:not(.ready) .rise,body:not(.ready) .panel.on{animation-play-state:paused}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
/* contractor logo reveal */
#k-rev{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--g) 70%,white) 0%,var(--g) 62%);transition:opacity .55s var(--ease),visibility .55s,transform .55s var(--ease)}
#k-rev.hide{opacity:0;visibility:hidden;transform:scale(1.04)}
#k-rev .card{position:relative;overflow:hidden;background:#fff;border-radius:28px;padding:22px 28px;border:0;box-shadow:0 18px 50px rgba(0,0,0,.28);opacity:0;transform:scale(.55) rotate(-4deg);filter:blur(8px);animation:krIn .9s cubic-bezier(.2,1.25,.35,1) .45s forwards}
#k-rev .card img{display:block;max-width:220px;max-height:120px;object-fit:contain}
#k-rev .card .ini{width:120px;height:120px;border-radius:22px;background:var(--g);color:#fff;font:800 48px/120px Inter,-apple-system,Helvetica,Arial;text-align:center}
#k-rev .card:after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);animation:krShine .9s ease 1.25s forwards}
#k-rev .nm{color:#fff;font:700 22px/1.2 Inter,-apple-system,Helvetica,Arial,sans-serif;letter-spacing:-.02em;opacity:0;transform:translateY(10px);animation:krUp .6s var(--ease) 1.15s forwards;text-align:center;padding:0 24px}
#k-rev .tg2{color:rgba(255,255,255,.75);font:600 11.5px/1 Inter,-apple-system,Helvetica,Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:0;animation:krUp .6s var(--ease) 1.35s forwards}
@keyframes krIn{to{opacity:1;transform:none;filter:none}}
@keyframes krShine{to{left:130%}}
@keyframes krUp{to{opacity:1;transform:none}}
@media(min-width:861px){.seg{display:none}.panel{display:block!important;animation:none}.grid{grid-template-columns:1.35fr 1fr}#p-all{grid-column:1/-1}}
@media(max-width:860px){.grid{display:block}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style><link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20120%20120%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2226%22%20fill%3D%22%23222B45%22/%3E%3Cpath%20d%3D%22M33%2031a27%2023%200%200%201%2054%200z%22%20fill%3D%22%23E8913F%22/%3E%3Crect%20x%3D%2257.5%22%20y%3D%2210%22%20width%3D%225%22%20height%3D%2220%22%20rx%3D%222.5%22%20fill%3D%22%23C46F28%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2228%22%20width%3D%2276%22%20height%3D%2210%22%20rx%3D%225%22%20fill%3D%22%23E8913F%22/%3E%3Crect%20x%3D%2232%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%2274%22%20rx%3D%227%22%20fill%3D%22%23FFFFFF%22/%3E%3Crect%20x%3D%2238.5%22%20y%3D%2244%22%20width%3D%2243%22%20height%3D%2262%22%20rx%3D%224%22%20fill%3D%22%23EEF1F8%22/%3E%3Cpath%20d%3D%22M47%2069l9%209%2018-20%22%20fill%3D%22none%22%20stroke%3D%22%23E8913F%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Crect%20x%3D%2245%22%20y%3D%2286%22%20width%3D%2230%22%20height%3D%223.4%22%20rx%3D%221.7%22%20fill%3D%22%23B3B8CC%22/%3E%3Crect%20x%3D%2245%22%20y%3D%2294%22%20width%3D%2221%22%20height%3D%223.4%22%20rx%3D%221.7%22%20fill%3D%22%23B3B8CC%22/%3E%3C/svg%3E"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet"><style>
#dq-load{position:fixed;inset:0;z-index:9999;background:#222B45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .45s ease,visibility .45s;font-family:Poppins,-apple-system,Helvetica,Arial,sans-serif}
#dq-load.hide{opacity:0;visibility:hidden}
#dq-load .lg{width:118px;height:118px;animation:dqpop .6s ease both}
#dq-load .wm{font-size:40px;font-weight:700;line-height:1;color:#fff;letter-spacing:-.5px;margin-top:6px;animation:dqfade .6s .1s ease both}
#dq-load .wq{font-size:17px;font-weight:600;color:#E8913F;letter-spacing:.42em;margin-left:.42em;animation:dqfade .6s .15s ease both}
#dq-load .tg{font-size:13px;color:#aeb5cc;margin-top:14px;font-family:-apple-system,Helvetica,Arial,sans-serif;animation:dqfade .6s .25s ease both}
#dq-load .lbar{width:170px;height:5px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
#dq-load .lbar i{display:block;height:100%;width:40%;border-radius:5px;background:#E8913F;animation:dqbar 1.1s ease-in-out infinite}
@keyframes dqbar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@keyframes dqpop{from{transform:translateY(-8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes dqfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style></head>
<body><div id="dq-load"><div class="lg"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><path d="M33 31a27 23 0 0 1 54 0z" fill="#E8913F"/><rect x="57.5" y="10" width="5" height="20" rx="2.5" fill="#C46F28"/><rect x="22" y="28" width="76" height="10" rx="5" fill="#E8913F"/><rect x="32" y="38" width="56" height="74" rx="7" fill="#FFFFFF"/><rect x="38.5" y="44" width="43" height="62" rx="4" fill="#EEF1F8"/><path d="M47 69l9 9 18-20" fill="none" stroke="#E8913F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="86" width="30" height="3.4" rx="1.7" fill="#B3B8CC"/><rect x="45" y="94" width="21" height="3.4" rx="1.7" fill="#B3B8CC"/></svg></div><div class="wm">DuPage</div><div class="wq">QUOTES</div><div class="tg">Loading your quotes &amp; schedule…</div><div class="lbar"><i></i></div></div>
<div id="k-rev"></div>
<section class="hero"><div class="wrap">
  <div class="top"><span class="pill"><i></i>Live · updates on its own</span>
    <button class="iconbtn" id="rf" aria-label="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button></div>
  <div class="id rise"><div id="logo"></div><div><div class="hi" id="hi"></div><h1 id="nm"></h1></div></div>
  <div class="date rise" style="--i:1" id="sub"></div>
</div></section>
<main id="main"></main>
<footer>Updated automatically when a quote is made or accepted<br>Powered by <b>DuPage Quotes</b> · dupagequotes@gmail.com</footer>
<script>
const API = "https://script.google.com/macros/s/AKfycbyhZMVpTW09drWGodTUBtjCvWqbxEt29fpmDgbzyaaY91habK3yg_oRDaRf8U9Ehyyi/exec";
const P = new URLSearchParams(location.search);
async function api(params){ const r = await fetch(API + '?' + new URLSearchParams(params), {credentials:'omit'}); return r.json(); }
function hideLoad(){ const l=document.getElementById('dq-load'); if(l){ l.classList.add('hide'); setTimeout(()=>l.remove(),500); } }
function fail(msg){ hideLoad(); document.body.innerHTML = '<div style="font-family:-apple-system,Helvetica,Arial;max-width:520px;margin:60px auto;padding:0 20px;color:#333"><h2>DuPage Quotes</h2><p>'+msg+'</p></div>'; }
(async()=>{
const j = await api({api:'dash', d:P.get('d')||''});
if(!j.ok){ fail(j.error||'This dashboard link is not valid. Text David at DuPage Quotes for a new one.'); return; }
const D = j.data; D.base = 'q.html'; document.title = D.contractor + ' – My DuPage Quotes';


const e = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m0 = x => '$'+Math.round(Number(x)).toLocaleString('en-US');
const m2 = x => '$'+Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const th = D.theme || {p:'#1F4D3A',a:'#C8892B',s:'#F1F4F2',f:'Inter,-apple-system,Helvetica,Arial,sans-serif'};
const rs = document.documentElement.style; rs.setProperty('--g', th.p); rs.setProperty('--a', th.a);
const TOK = (typeof P !== 'undefined' && P.get('d')) || 'x';
const ini = s => (String(s||'').match(/[A-Za-z]+/g)||['?']).slice(0,2).map(w=>w[0]).join('').toUpperCase();
document.getElementById('logo').innerHTML = D.logo ? '<img src="' + D.logo + '" alt="">' : '<b>' + ini(D.contractor) + '</b>';
// Contractor logo reveal (after the DuPage Quotes loading screen), then the dashboard
(()=>{ const r=document.getElementById('k-rev'); if(!r) return;
  r.innerHTML = '<div class="card">' + (D.logo ? '<img src="' + D.logo + '" alt="">' : '<div class="ini">' + ini(D.contractor) + '</div>') + '</div>'
    + '<div class="nm"></div><div class="tg2">Quotes &amp; schedule</div>';
  r.querySelector('.nm').textContent = D.contractor;
  const kr = sessionStorage.getItem('kr_' + TOK);      // full reveal once per app open
  setTimeout(()=>{ r.classList.add('hide'); document.body.classList.add('ready'); (window.onReady||[]).forEach(f=>f()); setTimeout(()=>r.remove(),600); }, kr ? 900 : 2700);
  sessionStorage.setItem('kr_' + TOK, '1');
  if (D.logo) { const l=document.createElement('link'); l.rel='apple-touch-icon'; l.href=D.logo; document.head.appendChild(l); }
  const m=document.createElement('meta'); m.name='theme-color'; m.content=th.p; document.head.appendChild(m);
  const t=document.createElement('meta'); t.name='apple-mobile-web-app-title'; t.content=D.contractor; document.head.appendChild(t);
})();
document.getElementById('rf').onclick = ev => { ev.currentTarget.classList.add('spin'); sessionStorage.setItem('kr_' + TOK, '1'); setTimeout(()=>location.reload(), 350); };
const today = D.today, month = today.slice(0,7);
const Q = D.quotes.map(q=>Object.assign({},q,{iso:q.date_iso||'', sd:(q.start_date||'').slice(0,10)}));
const link = q => `${D.base||''}?q=${encodeURIComponent(q.quote_no)}&t=${encodeURIComponent(q.token)}`;
const first = (D.contact && !/owner/i.test(D.contact)) ? D.contact.split(' ')[0] : '';
const hr = new Date().getHours();
document.getElementById('hi').textContent = (hr<12?'Good morning':hr<17?'Good afternoon':'Good evening') + (first?`, ${first}`:'');
document.getElementById('nm').textContent = D.contractor;
document.getElementById('sub').textContent = new Date(today+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const acc = Q.filter(q=>q.status==='Accepted'), waiting = Q.filter(q=>q.status!=='Accepted');
const upcoming = acc.filter(q=>!q.sd || q.sd>=today).sort((a,b)=>(a.sd||'9999').localeCompare(b.sd||'9999'));
const thisM = Q.filter(q=>q.iso.slice(0,7)===month);
const accM = thisM.filter(q=>q.status==='Accepted');
const sum = (a,f)=>a.reduce((s,q)=>s+Number(f(q)||0),0);
const bill = sum(thisM,q=>q.fee==='Paid'?7.99:0);
const days = q => q.iso ? Math.max(0,Math.round((new Date(today)-new Date(q.iso))/864e5)) : 0;
const dTo = q => q.sd ? Math.round((new Date(q.sd)-new Date(today))/864e5) : null;
const c = q => q.client||{};
const I = { cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  bill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>' };
const chev = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';
const dayBox = q => { if(!q.sd) return '<div class="day nd">DATE<br>TBD</div>'; const d=new Date(q.sd+'T12:00:00'), n=dTo(q);
  return `<div class="day${n!=null&&n<=7?' soon':''}"><small>${d.toLocaleDateString('en-US',{month:'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-US',{weekday:'short'})}</small></div>`; };
const when = q => { const n=dTo(q); if(n==null) return ''; return n===0?'<span class="tag br">Today</span>':n===1?'<span class="tag br">Tomorrow</span>':`<span class="tag br">In ${n} days</span>`; };
const pct = thisM.length ? Math.round(accM.length/thisM.length*100) : 0;
const R = 30, CIRC = 2*Math.PI*R;
const kpi = (i,cls,ic,l,val,raw,s) => `<div class="kpi rise ${cls}" style="--i:${i};--d0:120ms"><div class="l">${I[ic]}${l}</div><b class="num" data-to="${raw}" data-fmt="${val}">${val==='n'?raw:m0(raw)}</b><small>${s}</small></div>`;
document.getElementById('main').innerHTML = `
<div class="kpis">
 ${kpi(0,'hl','cal','Upcoming jobs','n',upcoming.length,'accepted &amp; booked')}
 ${kpi(1,'','clock','Waiting on clients','n',waiting.length,m0(sum(waiting,q=>q.price))+' not signed yet')}
 ${kpi(2,'','check','Won this month','$',sum(accM,q=>q.price),accM.length+' of '+thisM.length+' quotes')}
 <div class="kpi rise" style="--i:3;--d0:120ms"><div class="l">${I.bill}Your bill</div><b class="num">${m2(bill)}</b><small>${thisM.filter(q=>q.fee==='Free').length} free · ${thisM.filter(q=>q.fee==='Paid').length} × $7.99</small></div>
</div>
<div class="seg rise" style="--i:4;--d0:120ms" id="seg"><span class="thumb" id="thumb"></span>
 <button class="on" data-p="0">Schedule<em>${upcoming.length}</em></button><button data-p="1">Waiting<em>${waiting.length}</em></button><button data-p="2">All quotes</button></div>
<div class="grid">
<div>
 <div class="panel on rise" id="p-sched" style="--i:5;--d0:120ms"><div class="card"><div class="ch"><h2>Upcoming jobs</h2><span>${upcoming.length} booked</span></div>
 ${upcoming.length?upcoming.map(q=>`<div class="job">${dayBox(q)}<div>
   <div class="t"><span>${e(c(q).name)}</span><span class="num">${m0(q.price)}</span></div>
   <div class="p">${e(q.project)}</div>
   <div class="m">${when(q)}${q.deposit_paid?`<span class="tag ok">✓ Deposit ${m0(q.deposit_paid)} paid</span><span>Balance <b class="num">${m0(q.price-q.deposit_paid)}</b></span>`:(q.deposit_pct?`<span class="tag wait">Deposit ${m0(q.price*q.deposit_pct/100)} due</span>`:'')}</div>
   <div class="m">${e([c(q).address,c(q).city].filter(Boolean).join(', '))}</div>
   <div class="m"><span>✓ Accepted by ${e(q.accepted_name)}</span><a class="go" href="${link(q)}">View quote ›</a></div></div></div>`).join(''):'<div class="empty"><b>🗓️</b>No booked jobs yet.<br>They show up here the moment a client taps Accept.</div>'}
 </div></div>
 <div class="panel" id="p-all"><div class="card"><div class="ch"><h2>All quotes</h2><span>${Q.length} total</span></div>
 ${Q.length?Q.slice().sort((a,b)=>b.iso.localeCompare(a.iso)).map(q=>`<a class="row" href="${link(q)}"><div class="av">${ini(c(q).name)}</div>
   <div class="mid"><div class="n">${e(c(q).name)}</div><div class="s">${e(q.date)} · ${e(q.project)}</div></div>
   <div class="r"><div class="num">${m0(q.price)}</div>${q.status==='Accepted'?(q.deposit_paid?'<span class="tag ok">Deposit paid</span>':'<span class="tag ok">Accepted</span>'):'<span class="tag wait">Waiting</span>'}</div>${chev}</a>`).join(''):'<div class="empty">No quotes yet.</div>'}
 </div></div>
</div>
<div>
 <div class="panel" id="p-wait"><div class="card"><div class="ch"><h2>Waiting on clients</h2><span>${m0(sum(waiting,q=>q.price))}</span></div>
 ${waiting.length?waiting.sort((a,b)=>a.iso.localeCompare(b.iso)).map(q=>{const d=days(q);return `<a class="row" href="${link(q)}"><div class="av">${ini(c(q).name)}</div>
   <div class="mid"><div class="n">${e(c(q).name)}</div><div class="s">${e(q.project)}</div></div>
   <div class="r"><div class="num">${m0(q.price)}</div>${d>=5?`<span class="tag hot">${d}d · give a call</span>`:`<span class="tag wait">sent ${d===0?'today':d+'d ago'}</span>`}</div>${chev}</a>`}).join(''):'<div class="empty"><b>👍</b>Nothing waiting.</div>'}
 </div></div>
 <div class="card rise" style="--i:6;--d0:120ms;margin-top:14px"><div class="ch"><h2>${new Date(today+'T12:00:00').toLocaleDateString('en-US',{month:'long'})} so far</h2></div>
  <div class="ring"><svg width="76" height="76" viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="${R}" fill="none" stroke-width="9"/>
   <circle class="fg" id="rg" cx="38" cy="38" r="${R}" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}" transform="rotate(-90 38 38)"/></svg>
   <div><b class="num">${pct}%</b><small>of this month's quotes accepted</small></div></div>
  <div class="ml">
   <div><span>Quotes sent</span><span class="num">${thisM.length}</span></div>
   <div><span>Value quoted</span><span class="num">${m0(sum(thisM,q=>q.price))}</span></div>
   <div><span>Accepted by clients</span><span class="num">${m0(sum(accM,q=>q.price))}</span></div>
   <div><span>Free quotes used</span><span class="num">${thisM.filter(q=>q.fee==='Free').length}</span></div>
   <div class="bill"><span>DuPage Quotes bill</span><span class="num">${m2(bill)}</span></div>
  </div></div>
</div></div>`;
// segmented tabs (phone)
const panels = ['p-sched','p-wait','p-all'].map(id=>document.getElementById(id));
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{ const i=+b.dataset.p;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('thumb').style.transform = `translateX(${i*100}%)`;
  panels.forEach((p,j)=>{ p.classList.toggle('on', j===i); p.classList.remove('rise'); });
  if (navigator.vibrate) navigator.vibrate(8); });
// count-up numbers + ring, timed to land just after the reveal
(window.onReady = window.onReady || []).push(()=>setTimeout(()=>{
  document.getElementById('rg').style.strokeDashoffset = CIRC*(1-pct/100);
  document.querySelectorAll('[data-to]').forEach(el=>{ const to=+el.dataset.to, money=el.dataset.fmt==='$', t0=performance.now(), dur=900;
    const f=t=>{ const k=Math.min(1,(t-t0)/dur), v=to*(1-Math.pow(1-k,4)); el.textContent = money?m0(v):Math.round(v); if(k<1) requestAnimationFrame(f); };
    requestAnimationFrame(f); });
}, 250));
if (!document.getElementById('k-rev')) { document.body.classList.add('ready'); window.onReady.forEach(f=>f()); }

hideLoad();
})();
</script>
</body></html>
