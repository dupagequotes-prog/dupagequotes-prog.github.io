<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* DuPage Quotes – contractor dashboard v2 ("very modern")
   Colors come from the contractor (--g brand, --a accent); everything else is neutral. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#1F4D3A;--a:#C8892B;--ink:#0f1115;--mute:#6b7079;--line:rgba(15,17,21,.07);
  --bg:color-mix(in srgb,var(--g) 4%,#f6f6f7);--card:#fff;
  --ease:cubic-bezier(.23,1,.32,1);--spring:cubic-bezier(.34,1.4,.64,1);
  --sh:0 1px 2px rgba(15,17,21,.04),0 4px 12px rgba(15,17,21,.04),0 16px 32px -12px rgba(15,17,21,.08);
  --tint:color-mix(in srgb,var(--g) 9%,white);--tint2:color-mix(in srgb,var(--g) 16%,white)}
html{background:var(--bg)}
body{margin:0;background:var(--bg);font-family:Inter,-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";letter-spacing:-.006em}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 20px 86px;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--a) 55%,transparent) 0%,transparent 55%),
             radial-gradient(90% 80% at 0% 100%,color-mix(in srgb,var(--g) 40%,black) 0%,transparent 60%),var(--g)}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:18px 18px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);-webkit-mask-image:linear-gradient(to bottom,black,transparent 85%)}
.wrap{max-width:1040px;margin:0 auto;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.02em;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 11px;border-radius:99px}
.pill i{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  color:#fff;cursor:pointer;transition:transform .16s var(--ease),background .2s}
.iconbtn:active{transform:scale(.92)}.iconbtn.spin svg{animation:spin .8s var(--ease)}@keyframes spin{to{transform:rotate(360deg)}}
.id{display:flex;align-items:center;gap:14px;margin-top:26px}
#logo{flex:none;width:60px;height:60px;border-radius:18px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#logo img{max-width:52px;max-height:52px;object-fit:contain}#logo b{color:var(--g);font-size:22px;font-weight:800}
.hi{font-size:13px;opacity:.78;font-weight:500}
h1{margin:2px 0 0;font-size:clamp(24px,6.4vw,34px);line-height:1.08;font-weight:700;letter-spacing:-.03em}
.date{margin-top:16px;font-size:13.5px;opacity:.8}
/* ---------- main ---------- */
main{max-width:1040px;margin:-62px auto 0;padding:0 14px calc(env(safe-area-inset-bottom) + 30px);position:relative}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border-radius:20px;padding:14px 15px 15px;box-shadow:var(--sh);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi .l{font-size:12px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .l svg{width:15px;height:15px;color:var(--g)}
.kpi b{display:block;font-size:28px;font-weight:700;margin-top:6px;color:var(--ink);line-height:1.05}
.kpi small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.kpi.hl{background:linear-gradient(160deg,var(--g),color-mix(in srgb,var(--g) 70%,black));color:#fff;border-color:transparent}
.kpi.hl .l,.kpi.hl small{color:rgba(255,255,255,.75)}.kpi.hl b{color:#fff}.kpi.hl .l svg{color:#fff}
.seg{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:5;margin:18px 0 12px;display:grid;grid-template-columns:repeat(3,1fr);
  background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);
  border:1px solid var(--line);border-radius:16px;padding:4px;box-shadow:0 6px 20px -10px rgba(15,17,21,.18)}
.seg button{position:relative;z-index:1;border:0;background:none;font:600 13.5px/1 Inter,-apple-system,sans-serif;color:var(--mute);padding:11px 4px;border-radius:12px;cursor:pointer;transition:color .25s}
.seg button.on{color:var(--ink)}
.seg button em{font-style:normal;font-size:11px;font-weight:700;margin-left:5px;padding:2px 6px;border-radius:99px;background:var(--tint);color:var(--g)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:var(--card);
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.07);transition:transform .45s var(--spring)}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.panel{display:none}.panel.on{display:block;animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:6px 16px;box-shadow:var(--sh);border:1px solid var(--line)}
.card+.card{margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 0 6px}
.ch h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}.ch span{font-size:12px;color:var(--mute)}
/* schedule timeline */
.job{display:grid;grid-template-columns:54px 1fr;gap:13px;padding:13px 0;border-top:1px solid var(--line);position:relative}
.ch+.job{border-top:0}
.day{align-self:start;border-radius:16px;text-align:center;padding:7px 0 8px;background:var(--tint);color:var(--g)}
.day small{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.day b{display:block;font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.day.nd{min-height:62px;background:#f1f1f3;color:#8b8f97;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;line-height:1.3}
.day.soon{background:var(--g);color:#fff}
.job .t{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
.job .t .num{font-weight:700}
.job .p{color:#3a3e45;font-size:14px;margin-top:1px}
.job .m{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag.ok{background:color-mix(in srgb,#16a34a 12%,white);color:#15803d}
.tag.br{background:var(--tint);color:var(--g)}
.tag.wait{background:#fff4e0;color:#a15c00}.tag.hot{background:#fee9e7;color:#b42318}
a.go{display:inline-flex;align-items:center;gap:4px;color:var(--g);font-weight:600;font-size:12.5px;text-decoration:none;padding:3px 0}
/* lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .16s var(--ease)}
.ch+.row,.row:first-child{border-top:0}.row:active{transform:scale(.985)}
.av{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--tint);color:var(--g)}
.row .mid{flex:1;min-width:0}.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}.row .r .num{font-weight:700;font-size:15px}.row .r .tag{margin-top:4px}
.chev{color:#c3c6cc;flex:none}
.empty{color:var(--mute);font-size:14px;padding:18px 0 20px;text-align:center}
.empty b{display:block;font-size:28px;margin-bottom:4px}
/* month */
.ring{display:flex;align-items:center;gap:16px;padding:12px 0 6px}
.ring svg{flex:none}.ring .bg{stroke:var(--tint2)}.ring .fg{stroke:var(--g);transition:stroke-dashoffset 1.2s var(--ease)}
.ring b{font-size:24px;font-weight:700}.ring small{display:block;color:var(--mute);font-size:12.5px}
.ml div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ml div span:first-child{color:var(--mute)}.ml div span:last-child{font-weight:600}
.ml .bill{font-weight:700}.ml .bill span:last-child{color:var(--g);font-size:16px}
footer{text-align:center;font-size:12px;color:#9a9ea6;margin:26px 16px calc(env(safe-area-inset-bottom) + 30px)}
footer b{color:#6b7079;font-weight:600}
/* entrance */
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms + var(--d0,0ms))}
body:not(.ready) .rise,body:not(.ready) .panel.on{animation-play-state:paused}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
/* contractor logo reveal */
#k-rev{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--g) 70%,white) 0%,var(--g) 62%);transition:opacity .55s var(--ease),visibility .55s,transform .55s var(--ease)}
#k-rev.hide{opacity:0;visibility:hidden;transform:scale(1.04)}
#k-rev .card{position:relative;overflow:hidden;background:#fff;border-radius:28px;padding:22px 28px;border:0;box-shadow:0 18px 50px rgba(0,0,0,.28);opacity:0;transform:scale(.55) rotate(-4deg);filter:blur(8px);animation:krIn .9s cubic-bezier(.2,1.25,.35,1) .45s forwards}
#k-rev .card img{display:block;max-width:220px;max-height:120px;object-fit:contain}
#k-rev .card .ini{width:120px;height:120px;border-radius:22px;background:var(--g);color:#fff;font:800 48px/120px Inter,-apple-system,Helvetica,Arial;text-align:center}
#k-rev .card:after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);animation:krShine .9s ease 1.25s forwards}
#k-rev .nm{color:#fff;font:700 22px/1.2 Inter,-apple-system,Helvetica,Arial,sans-serif;letter-spacing:-.02em;opacity:0;transform:translateY(10px);animation:krUp .6s var(--ease) 1.15s forwards;text-align:center;padding:0 24px}
#k-rev .tg2{color:rgba(255,255,255,.75);font:600 11.5px/1 Inter,-apple-system,Helvetica,Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:0;animation:krUp .6s var(--ease) 1.35s forwards}
@keyframes krIn{to{opacity:1;transform:none;filter:none}}
@keyframes krShine{to{left:130%}}
@keyframes krUp{to{opacity:1;transform:none}}
@media(min-width:861px){.seg{display:none}.panel{display:block!important;animation:none}.grid{grid-template-columns:1.35fr 1fr}#p-all{grid-column:1/-1}}
@media(max-width:860px){.grid{display:block}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
/* ---------- v3 interactive additions ---------- */
.top .acts{display:flex;gap:8px}
.bdot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 0 2px var(--g)}
.iconbtn{position:relative}
.week{display:flex;gap:8px;overflow-x:auto;margin:20px -20px 0;padding:2px 20px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.week::-webkit-scrollbar{display:none}
.dy{flex:none;width:56px;border-radius:16px;padding:8px 0 9px;text-align:center;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
  font:600 12px Inter,-apple-system,sans-serif;transition:transform .16s var(--ease),background .2s;position:relative}
.dy b{display:block;font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.dy:active{transform:scale(.94)}
.dy.today{border-color:rgba(255,255,255,.6)}
.dy.on{background:#fff;color:var(--g);border-color:#fff}
.dy i{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:99px;padding:7px 14px;font:600 13px Inter,-apple-system,sans-serif;cursor:pointer;transition:background .2s}
.chip2.on{background:#fff;color:var(--g);border-color:#fff}
.hero.v3{padding-bottom:78px}
/* address */
.addr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.addr .at{font-size:13px;color:#3a3e45;cursor:pointer;-webkit-user-select:all;user-select:all}
.mb{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 9px;font:600 11.5px Inter,-apple-system,sans-serif;color:var(--g);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .14s var(--ease)}
.mb:active{transform:scale(.93)}
.mb svg{width:12px;height:12px}
/* progress */
.prog{border:1px solid var(--line);border-radius:16px;padding:11px 13px 12px;margin-top:10px;background:color-mix(in srgb,var(--g) 3%,white)}
.prog .ph{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.prog .ph span:last-child{color:var(--g)}
input[type=range].rg{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;margin:10px 0 2px;outline:none;
  background:linear-gradient(90deg,var(--g) 0,var(--g) var(--v,0%),var(--tint2) var(--v,0%))}
input[type=range].rg::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--g);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
input[type=range].rg::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--g)}
/* actions row */
.arow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:1px solid var(--line)}
.arow button,.arow a{border:0;background:none;padding:11px 4px 4px;font:600 12.5px Inter,-apple-system,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-decoration:none;transition:transform .14s var(--ease)}
.arow > *+*{border-left:1px solid var(--line)}
.arow svg{width:20px;height:20px;color:var(--g)}
.arow > *:active{transform:scale(.94)}
.day{cursor:pointer;transition:transform .14s var(--ease)}.day:active{transform:scale(.94)}
.crewmini{display:flex;margin-top:8px}.crewmini span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;border:2px solid #fff;margin-left:-6px}
.crewmini span:first-child{margin-left:0}
/* waiting tracker */
.wcard{padding:14px 0;border-top:1px solid var(--line)}.ch+.wcard{border-top:0}
.wcard .t{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15.5px}
.pend{font-size:17px;font-weight:700;color:var(--g);margin-top:6px;letter-spacing:-.01em}
.trk{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;margin:14px 4px 4px}
.trk .dt{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px dashed #c9ccd3;background:#fff}
.trk .dt.done{background:var(--g);border:0;color:#fff}.trk .dt.done svg{width:12px;height:12px}
.trk .dt.cur{border:0;background:var(--tint2);box-shadow:0 0 0 5px color-mix(in srgb,var(--g) 12%,transparent)}.trk .dt.cur:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--g)}
.trk .ln{height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,#d5d8de 0 6px,transparent 6px 11px);margin:0 4px}
.trk .ln.done{background:var(--g)}
.trkl{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:12px;color:var(--mute);margin:6px 0 2px}
.trkl span:nth-child(2){text-align:center}.trkl span:last-child{text-align:right}.trkl b{color:var(--ink)}
.wmeta{font-size:12.5px;color:var(--mute);margin-top:8px}
.btns{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:12px 10px;font:700 14px Inter,-apple-system,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .14s var(--ease);text-decoration:none}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--g);color:#fff;box-shadow:0 8px 18px -10px var(--g)}
.btn.sec{background:#f1f1f4;color:var(--ink)}
.btn svg{width:17px;height:17px}
/* chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;padding:8px 0 0}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .st{width:100%;max-width:34px;position:relative;border-radius:8px 8px 6px 6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .q{background:var(--tint2);width:100%;transform-origin:bottom;transform:scaleY(0);transition:transform .9s var(--ease)}
.bars .w{background:var(--g);width:100%;transform-origin:bottom;transform:scaleY(0);transition:transform .9s var(--ease) .1s}
.bars.go .q,.bars.go .w{transform:scaleY(1)}
.bars small{font-size:11px;color:var(--mute);font-weight:600}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin:8px 0 4px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* deadlines */
.dl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}.ch+.dl{border-top:0}
.dl .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--g);flex:none}.dl .ic svg{width:18px;height:18px}
/* floating button */
#fab{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:20;border:0;border-radius:99px;padding:14px 22px;background:var(--g);color:#fff;
  font:700 15px Inter,-apple-system,sans-serif;display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;box-shadow:0 14px 30px -10px var(--g),0 4px 12px rgba(0,0,0,.18);transition:transform .2s var(--ease)}
#fab:active{transform:translateX(-50%) scale(.95)}
#fab small{font-weight:600;opacity:.8}
body{padding-bottom:70px}
/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .45s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.2);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:#cfd2d8;margin:4px auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 12px}
.sh-h h3{margin:0;font-size:17px;letter-spacing:-.01em}
.x{border:0;background:#e9e9ee;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:#555}
.jd-t{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:2px 0 6px}
.mapcard{position:relative;height:96px;border-radius:16px;overflow:hidden;margin-top:12px;border:1px solid var(--line);

/* ---------- helpers ---------- */
let tt; const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); };
const haptic = () => { if (navigator.vibrate) navigator.vibrate(8); };
async function save(q, fields, okMsg){
  Object.assign(q, fields); if ('start_date' in fields) q.sd = fields.start_date;
  if (typeof API === 'undefined') { toast('Preview only – not saved'); return; }
  try { const r = await fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'dash_update',d:TOK,quote_no:q.quote_no,fields})});
    const j = await r.json(); toast(j.ok ? (okMsg||'Saved ✓') : ('Not saved: '+(j.error||'try again'))); }
  catch(x){ toast('No connection – not saved'); }
}
async function saveCrew(){
  if (typeof API === 'undefined') return;
  try { await fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'dash_crew',d:TOK,crew:CREW})}); } catch(x){}
}
async function copyText(t, msg){
  try { await navigator.clipboard.writeText(t); }
  catch(x){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); try{document.execCommand('copy');}catch(y){} a.remove(); }
  haptic(); toast(msg||'Copied ✓');
}
const amap = a => 'https://maps.apple.com/?q=' + encodeURIComponent(a);
const gmap = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a);
const addrBlock = q => { const a = addrOf(q); if(!a) return ''; return `<div class="addr"><span class="at" data-act="copy" data-v="${e(a)}">${e(a)}</span>
  <button class="mb" data-act="copy" data-v="${e(a)}">${I.copy}Copy</button><a class="mb" href="${amap(a)}" target="_blank" rel="noopener">${I.apple}Apple</a><a class="mb" href="${gmap(a)}" target="_blank" rel="noopener">${I.g}Google</a></div>`; };
const crewMini = q => (q.crew&&q.crew.length) ? `<div class="crewmini">${q.crew.map(n=>`<span style="background:${colorOf(n)}" title="${e(n)}">${e(ini(n))}</span>`).join('')}</div>` : '';
let pick; const pickDate = (val, cb) => { if(!pick){ pick=document.createElement('input'); pick.type='date'; pick.style.cssText='position:fixed;left:50%;top:40%;opacity:0;width:1px;height:1px'; document.body.appendChild(pick); }
  pick.value = val || today; pick.onchange = () => cb(pick.value);
  try { pick.showPicker(); } catch(x){ pick.focus(); pick.click(); } };

/* ---------- header: week strip + crew chips ---------- */
const jobsOn = d => Q.filter(q=>q.status==='Accepted' && (q.sd===d || q.deadline===d));
function renderWeek(){
  const t = dnum(today), mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay()+6)%7));
  let h=''; for (let i=0;i<14;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    h += `<button class="dy${iso===today?' today':''}${S.day===iso?' on':''}" data-act="day" data-v="${iso}">${d.toLocaleDateString('en-US',{weekday:'short'})}<b>${d.getDate()}</b>${jobsOn(iso).length?'<i></i>':''}</button>`; }
  document.getElementById('week').innerHTML = h;
  const names = [...new Set([].concat(CREW, ...Q.map(q=>q.crew||[])))];
  document.getElementById('chips').innerHTML = names.length ? ['',...names].map(n=>`<button class="chip2${S.who===n?' on':''}" data-act="who" data-v="${e(n)}">${n?e(n):'All'}</button>`).join('') : '';
}

/* ---------- main ---------- */
function render(){
  const acc = Q.filter(q=>q.status==='Accepted'), waiting = Q.filter(q=>q.status!=='Accepted');
  let upcoming = acc.filter(q=>!q.sd || q.sd>=today || (Number(q.progress||0)>0 && Number(q.progress)<100)).sort((a,b)=>(a.sd||'9999').localeCompare(b.sd||'9999'));
  if (S.who) upcoming = upcoming.filter(q=>(q.crew||[]).includes(S.who));
  if (S.day) upcoming = acc.filter(q=>q.sd===S.day || q.deadline===S.day).filter(q=>!S.who || (q.crew||[]).includes(S.who));
  const thisM = Q.filter(q=>q.iso.slice(0,7)===month), accM = thisM.filter(q=>q.status==='Accepted');
  const bill = sum(thisM,q=>q.fee==='Paid'?7.99:0);
  const dayBox = q => { if(!q.sd) return `<div class="day nd" data-act="date" data-q="${e(q.quote_no)}">SET<br>DATE</div>`; const d=dnum(q.sd), n=dTo(q.sd);
    return `<div class="day${n!=null&&n<=7&&n>=0?' soon':''}" data-act="date" data-q="${e(q.quote_no)}"><small>${d.toLocaleDateString('en-US',{month:'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('en-US',{weekday:'short'})}</small></div>`; };
  const when = q => { const n=dTo(q.sd); if(n==null) return ''; return n===0?'<span class="tag br">Today</span>':n===1?'<span class="tag br">Tomorrow</span>':n<0?'<span class="tag br">Started</span>':`<span class="tag br">In ${n} days</span>`; };
  const depTag = q => q.deposit_paid ? `<span class="tag ok">✓ Deposit ${m0(q.deposit_paid)} paid</span>` : (q.deposit_pct?`<span class="tag wait">Deposit ${m0(depAmt(q))} due</span>`:'');
  const jobCard = q => { const p=Number(q.progress||0); return `<div class="job">${dayBox(q)}<div>
     <div class="t"><span>${e(c(q).name)}</span><span class="num">${m0(q.price)}</span></div>
     <div class="p">${e(q.project)}</div>
     <div class="m">${when(q)}${depTag(q)}${q.deadline?`<span class="tag br">Due ${dnum(q.deadline).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span>`:''}</div>
     ${addrBlock(q)}${crewMini(q)}</div></div>
     <div class="prog"><div class="ph"><span>Job progress</span><span id="pv_${e(q.quote_no)}">${p}%</span></div>
       <input type="range" class="rg" min="0" max="100" step="5" value="${p}" style="--v:${p}%" data-act="prog" data-q="${e(q.quote_no)}"></div>
     <div class="arow"><button data-act="date" data-q="${e(q.quote_no)}">${I.cal}${q.sd?'Change date':'Schedule date'}</button>
       <button data-act="job" data-q="${e(q.quote_no)}">${I.info}Job details</button>
       <a href="${link(q)}&src=k">${I.doc}View quote</a></div>`; };
  const steps = q => { const v = !!q.viewed_at, sgn = q.status==='Accepted';
    return `<div class="trk"><span class="dt done">${I.tick}</span><span class="ln ${v?'done':''}"></span><span class="dt ${sgn?'done':v?'cur':''}">${sgn?I.tick:''}</span><span class="ln ${sgn?'done':''}"></span><span class="dt ${sgn?'done':''}">${sgn?I.tick:''}</span></div>
      <div class="trkl"><span><b>Sent</b></span><span>${v?`<b>Viewed</b> ${ago(q.last_viewed_at||q.viewed_at)}${q.views>1?` · ${q.views}×`:''}`:'Not opened yet'}</span><span>Signed</span></div>`; };
  const wCard = q => { const d=days(q); return `<div class="wcard">
     <div class="t"><span>${e(c(q).name)}</span><span class="num">${m0(q.price)}</span></div>
     <div class="p" style="color:#3a3e45;font-size:14px">${e(q.project)}</div>
     <div class="pend"><span class="num">${m0(q.price)}</span> pending signature</div>
     ${steps(q)}
     <div class="wmeta">Sent ${d===0?'today':d===1?'yesterday':d+' days ago'}${c(q).email?' to '+e(c(q).email):''}${d>=5?' · <b style="color:#b42318">give them a call</b>':''}</div>
     ${addrBlock(q)}
     <div class="btns"><button class="btn pri" data-act="nudge" data-q="${e(q.quote_no)}">${I.bellr}1-tap nudge client</button><button class="btn sec" data-act="adjust" data-q="${e(q.quote_no)}">${I.edit}Adjust quote</button></div></div>`; };
  // chart: last 6 months, quoted vs won
  const mons = []; { const t=dnum(today); for(let i=5;i>=0;i--){ const d=new Date(t.getFullYear(), t.getMonth()-i, 1); mons.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); } }
  const mq = mons.map(mo=>sum(Q.filter(q=>q.iso.slice(0,7)===mo),q=>q.price)), mw = mons.map(mo=>sum(Q.filter(q=>q.iso.slice(0,7)===mo && q.status==='Accepted'),q=>q.price));
  const mx = Math.max(1,...mq);
  const deadl = acc.filter(q=>(q.deadline&&q.deadline>=today)||(q.sd&&q.sd>=today)).map(q=>({q, d:q.deadline||q.sd, k:q.deadline?'Deadline':'Start'})).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);
  const kpi = (i,cls,ic,l,val,raw,s) => `<div class="kpi rise ${cls}" style="--i:${i};--d0:120ms"><div class="l">${I[ic]}${l}</div><b class="num" data-to="${raw}" data-fmt="${val}">${val==='n'?raw:m0(raw)}</b><small>${s}</small></div>`;
  document.getElementById('main').innerHTML = `
  <div class="kpis">
   ${kpi(0,'hl','cal','Upcoming jobs','n',acc.filter(q=>!q.sd||q.sd>=today).length,'accepted &amp; booked')}
   ${kpi(1,'','clock','Waiting on clients','n',waiting.length,m0(sum(waiting,q=>q.price))+' not signed yet')}
   ${kpi(2,'','check','Won this month','$',sum(accM,q=>q.price),accM.length+' of '+thisM.length+' quotes')}
   <div class="kpi rise" style="--i:3;--d0:120ms"><div class="l">${I.bill}Your bill</div><b class="num">${m2(bill)}</b><small>${thisM.filter(q=>q.fee==='Free').length} free · ${thisM.filter(q=>q.fee==='Paid').length} × $7.99</small></div>
  </div>
  <div class="seg rise" style="--i:4;--d0:120ms" id="seg"><span class="thumb" id="thumb" style="transform:translateX(${S.tab*100}%)"></span>
   <button class="${S.tab===0?'on':''}" data-act="tab" data-v="0">Schedule<em>${upcoming.length}</em></button><button class="${S.tab===1?'on':''}" data-act="tab" data-v="1">Waiting<em>${waiting.length}</em></button><button class="${S.tab===2?'on':''}" data-act="tab" data-v="2">All quotes</button></div>
  <div class="grid"><div>
   <div class="panel ${S.tab===0?'on':''} rise" id="p-sched" style="--i:5;--d0:120ms"><div class="card"><div class="ch"><h2>${S.day?dnum(S.day).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}):'Upcoming jobs'}</h2><span>${upcoming.length} job${upcoming.length===1?'':'s'}</span></div>
    ${(S.day||S.who)?`<div class="filt"><span>Filtered${S.who?' · '+e(S.who):''}</span><button data-act="clear">Show all</button></div>`:''}
    ${upcoming.length?upcoming.map(jobCard).join('<div style="height:1px;background:var(--line);margin:6px 0"></div>'):`<div class="empty"><b>🗓️</b>${S.day||S.who?'Nothing scheduled here.':'No booked jobs yet.<br>They show up here the moment a client taps Accept.'}</div>`}
   </div></div>
   <div class="panel ${S.tab===2?'on':''}" id="p-all"><div class="card"><div class="ch"><h2>All quotes</h2><span>${Q.length} total</span></div>
    ${Q.length?Q.slice().sort((a,b)=>b.iso.localeCompare(a.iso)).map(q=>`<a class="row" data-act="job" data-q="${e(q.quote_no)}" href="#"><div class="av">${ini(c(q).name)}</div>
     <div class="mid"><div class="n">${e(c(q).name)}</div><div class="s">${e(q.date)} · ${e(q.project)}</div></div>
     <div class="r"><div class="num">${m0(q.price)}</div>${q.status==='Accepted'?(q.deposit_paid?'<span class="tag ok">Deposit paid</span>':'<span class="tag ok">Accepted</span>'):(q.viewed_at?'<span class="tag br">Viewed</span>':'<span class="tag wait">Waiting</span>')}</div>${chev}</a>`).join(''):'<div class="empty">No quotes yet.</div>'}
   </div></div>
  </div><div>
   <div class="panel ${S.tab===1?'on':''}" id="p-wait"><div class="card"><div class="ch"><h2>Waiting on clients</h2><span>${m0(sum(waiting,q=>q.price))}</span></div>
    ${waiting.length?waiting.sort((a,b)=>a.iso.localeCompare(b.iso)).map(wCard).join(''):'<div class="empty"><b>👍</b>Nothing waiting.</div>'}
   </div></div>
   ${deadl.length?`<div class="card rise" style="--i:6;--d0:120ms;margin-top:14px"><div class="ch"><h2>Project deadlines</h2><span>next ${deadl.length}</span></div>
    ${deadl.map(x=>`<div class="dl" data-act="job" data-q="${e(x.q.quote_no)}"><div class="ic">${x.k==='Deadline'?I.flag:I.cal}</div><div class="mid" style="flex:1;min-width:0"><div class="n" style="font-weight:600">${e(c(x.q).name)}</div><div class="s" style="font-size:12.5px;color:var(--mute)">${x.k} · ${dnum(x.d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div></div><span class="tag br">${dTo(x.d)===0?'Today':'In '+dTo(x.d)+'d'}</span></div>`).join('')}</div>`:''}
   <div class="card rise" style="--i:7;--d0:120ms;margin-top:14px"><div class="ch"><h2>${new Date(today+'T12:00:00').toLocaleDateString('en-US',{month:'long'})} so far</h2><span>last 6 months</span></div>
    <div class="bars" id="bars">${mons.map((mo,i)=>`<div class="c"><div class="st" title="${m0(mq[i])} quoted · ${m0(mw[i])} won"><div class="q" style="height:${(mq[i]-mw[i])/mx*100}%"></div><div class="w" style="height:${mw[i]/mx*100}%"></div></div><small>${dnum(mo+'-15').toLocaleDateString('en-US',{month:'short'})}</small></div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--g)"></i>Won</span><span><i style="background:var(--tint2)"></i>Quoted, not signed</span></div>
    <div class="ml">
     <div><span>Quotes sent</span><span class="num">${thisM.length}</span></div>
     <div><span>Value quoted</span><span class="num">${m0(sum(thisM,q=>q.price))}</span></div>
     <div><span>Accepted by clients</span><span class="num">${m0(sum(accM,q=>q.price))}</span></div>
     <div class="bill"><span>DuPage Quotes bill</span><span class="num">${m2(bill)}</span></div>
    </div></div>
  </div></div>`;
  document.querySelectorAll('input.rg').forEach(r=>{ r.oninput = () => { r.style.setProperty('--v', r.value+'%'); const l=document.getElementById('pv_'+r.dataset.q); if(l) l.textContent=r.value+'%'; };
    r.onchange = () => { const q=Q.find(x=>x.quote_no===r.dataset.q); haptic(); save(q,{progress:+r.value}, r.value==100?'Job marked 100% done 🎉':'Progress saved ✓'); }; });
  if (document.body.classList.contains('ready')) requestAnimationFrame(()=>{ const b=document.getElementById('bars'); if(b) b.classList.add('go'); });
  renderWeek();
  const fee = Q.length < 2 ? 'free' : '$7.99'; document.getElementById('fabp').textContent = '· ' + fee;
  const seen = localStorage.getItem('seen_'+TOK) || ''; document.getElementById('bdot').hidden = !events().some(ev=>ev.t>seen);
}

/* ---------- sheets ---------- */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(title, html){ sheet.innerHTML = `<div class="grab"></div><div class="sh-h"><h3>${title}</h3><button class="x" data-act="close" aria-label="Close">×</button></div>${html}`; sheet.scrollTop=0; scrim.classList.add('on'); sheet.classList.add('on'); }
function closeSheet(){ scrim.classList.remove('on'); sheet.classList.remove('on'); }
scrim.onclick = closeSheet;
{ let y0=null; sheet.addEventListener('touchstart',ev=>{ if(sheet.scrollTop<=0) y0=ev.touches[0].clientY; },{passive:true});
  sheet.addEventListener('touchend',ev=>{ if(y0!=null && ev.changedTouches[0].clientY-y0>90) closeSheet(); y0=null; },{passive:true}); }

function jobSheet(q){
  const a = addrOf(q), dep = depAmt(q), paid = Number(q.deposit_paid||0), p = Number(q.progress||0);
  const roster = [...new Set([].concat(CREW, q.crew||[]))];
  openSheet('Job details', `
   <div style="font-size:14px;color:var(--mute);font-weight:600">${e(c(q).name)} · ${e(q.quote_no)}</div>
   <div class="jd-t">${e(q.project)}</div>
   ${a?`<div class="addr"><span class="at" data-act="copy" data-v="${e(a)}">${I.pin.replace('<svg','<svg width="14" height="14" style="color:var(--g);vertical-align:-2px"')} ${e(a)}</span></div>
   <div class="mapcard"><div class="pin">${I.pin}</div><div class="mbs"><button class="mb" data-act="copy" data-v="${e(a)}">${I.copy}Copy</button><a class="mb" href="${amap(a)}" target="_blank" rel="noopener">${I.apple}Apple Maps</a><a class="mb" href="${gmap(a)}" target="_blank" rel="noopener">${I.g}Google Maps</a></div></div>`:''}
   ${q.status==='Accepted'?`
   <div class="sbox"><h4>${I.check}Completion status</h4>
     <div class="ph" style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>Progress</span><span id="sp">${p}% complete</span></div>
     <input type="range" class="rg" id="srg" min="0" max="100" step="5" value="${p}" style="--v:${p}%"></div>
   <div class="sbox"><h4>${I.cal}Dates</h4>
     <div class="fld"><span>Start date</span><input type="date" id="fsd" value="${e(q.sd||'')}"></div>
     <div class="fld"><span>Deadline</span><input type="date" id="fdl" value="${e(q.deadline||'')}"></div></div>
   <div class="sbox"><h4>${I.crew}Crew assignment</h4>
     <div class="crew" id="crew">${roster.map(n=>`<button class="cm${(q.crew||[]).includes(n)?' on':''}" data-act="crewt" data-v="${e(n)}"><span class="av2" style="background:${colorOf(n)}">${e(ini(n))}</span>${e(n)}</button>`).join('')}
       <button class="cm" data-act="crewadd"><span class="add">+</span>Add</button></div>
     <div style="font-size:12px;color:var(--mute);margin-top:8px">Tap a name to put them on this job.</div></div>`:`
   <div class="sbox"><h4>${I.clock}Status</h4><div style="font-size:14px">Waiting for ${e(c(q).name)} to sign. ${q.viewed_at?`They opened it ${ago(q.last_viewed_at||q.viewed_at)}${q.views>1?` (${q.views} times)`:''}.`:'They haven’t opened it yet.'}</div>
     <div class="btns"><button class="btn pri" data-act="nudge" data-q="${e(q.quote_no)}">${I.bellr}Nudge client</button><button class="btn sec" data-act="adjust" data-q="${e(q.quote_no)}">${I.edit}Adjust quote</button></div></div>`}
   <div class="sbox"><h4>${I.money}Payment &amp; deposit</h4>
     ${dep||paid?`<label class="tgl"><span>Deposit paid (${m0(dep||paid)})</span><span class="sw"><input type="checkbox" id="fdp" ${paid?'checked':''}><span></span></span></label>`:'<div style="font-size:13.5px;color:var(--mute)">No deposit on this quote.</div>'}
     <div class="bl" style="margin-top:10px"><div><span>Total</span><span class="num">${m0(q.price)}</span></div><div><span>Paid</span><span class="num" id="bpaid">${m0(paid)}</span></div><div class="due"><span>Balance due</span><span class="num" id="bdue">${m0(q.price-paid)}</span></div></div>
     <div style="font-size:11.5px;color:var(--mute);margin-top:6px">This is your own record. No money moves through DuPage Quotes.</div></div>
   ${q.status==='Accepted'?`<div class="sbox"><h4>${I.doc}Job notes</h4><textarea class="nt" id="fnt" rows="3" placeholder="Gate code, materials, anything to remember…">${e(q.job_notes||'')}</textarea></div>`:''}
   <div class="btns" style="grid-template-columns:1fr 1fr"><a class="btn sec" href="${link(q)}&src=k">${I.doc}View quote</a><button class="btn sec" data-act="copy" data-v="${e(pubLink(q))}">${I.copy}Copy client link</button></div>`);
  sheet.dataset.q = q.quote_no;
  const g = id => document.getElementById(id);
  if (g('srg')) { g('srg').oninput = ev => { ev.target.style.setProperty('--v', ev.target.value+'%'); g('sp').textContent = ev.target.value+'% complete'; };
    g('srg').onchange = ev => { haptic(); save(q,{progress:+ev.target.value}, ev.target.value==100?'Job marked 100% done 🎉':'Progress saved ✓'); render(); }; }
  if (g('fsd')) g('fsd').onchange = ev => { save(q,{start_date:ev.target.value},'Start date saved ✓'); render(); };
  if (g('fdl')) g('fdl').onchange = ev => { save(q,{deadline:ev.target.value},'Deadline saved ✓'); render(); };
  if (g('fdp')) g('fdp').onchange = ev => { const v = ev.target.checked ? (dep||paid) : 0; haptic(); save(q,{deposit_paid:v}, v?'Deposit marked paid ✓':'Deposit marked unpaid');
    g('bpaid').textContent=m0(v); g('bdue').textContent=m0(q.price-v); render(); };
  if (g('fnt')) { let nt; g('fnt').oninput = ev => { clearTimeout(nt); nt=setTimeout(()=>save(q,{job_notes:ev.target.value},'Notes saved ✓'),900); }; }
}

function events(){
  const out=[]; Q.forEach(q=>{ const n=c(q).name;
    if (q.iso) out.push({t:q.iso+'T09:00:00', ic:'📄', bg:'var(--tint)', h:`Quote sent to <b>${e(n)}</b>`, s:m0(q.price)+' · '+e(q.project), q});
    if (q.viewed_at) out.push({t:q.last_viewed_at||q.viewed_at, ic:'👀', bg:'#eef6ff', h:`<b>${e(n)}</b> opened the quote`, s:(q.views>1?q.views+' views · ':'')+ago(q.last_viewed_at||q.viewed_at), q});
    if (q.status==='Accepted') { const at = q.accepted_at ? new Date(q.accepted_at) : null; out.push({t:(at&&!isNaN(at))?at.toISOString():(q.iso+'T10:00:00'), ic:'✅', bg:'#eafaf0', h:`<b>${e(n)}</b> accepted`, s:m0(q.price)+(q.accepted_at?' · '+e(q.accepted_at):''), q}); }
    if (q.deposit_paid) out.push({t:q.dash_updated||(q.iso+'T11:00:00'), ic:'💵', bg:'#fff6e5', h:`Deposit marked paid · <b>${e(n)}</b>`, s:m0(q.deposit_paid), q});
  });
  return out.sort((a,b)=>String(b.t).localeCompare(String(a.t))).slice(0,25);
}
function bellSheet(){
  const ev = events();
  openSheet('Activity', `<div class="sbox" style="margin-top:0">${ev.length?ev.map(x=>`<div class="ev" data-act="job" data-q="${e(x.q.quote_no)}" style="cursor:pointer"><div class="ic" style="background:${x.bg}">${x.ic}</div><div><div style="font-size:14px">${x.h}</div><div class="s">${x.s}</div></div></div>`).join(''):'<div class="empty">Nothing yet.</div>'}</div>`);
  localStorage.setItem('seen_'+TOK, new Date().toISOString()); document.getElementById('bdot').hidden = true;
}
function searchSheet(){
  openSheet('Search', `<input class="tx" id="sq" placeholder="Client, address, job or quote #" autocomplete="off"><div class="sbox" id="sr" style="padding-top:4px;padding-bottom:4px"></div>`);
  const run = () => { const t = document.getElementById('sq').value.trim().toLowerCase();
    const res = Q.filter(q=>!t || [c(q).name,addrOf(q),q.project,q.quote_no].join(' ').toLowerCase().includes(t));
    document.getElementById('sr').innerHTML = res.length ? res.map(q=>`<a class="row" data-act="job" data-q="${e(q.quote_no)}" href="#"><div class="av">${ini(c(q).name)}</div><div class="mid"><div class="n">${e(c(q).name)}</div><div class="s">${e(addrOf(q)||q.project)}</div></div><div class="r"><div class="num">${m0(q.price)}</div></div>${chev}</a>`).join('') : '<div class="empty">No matches.</div>'; };
  document.getElementById('sq').oninput = run; run(); setTimeout(()=>document.getElementById('sq').focus(), 350);
}
function reqSheet(){
  const fee = Q.length < 2 ? 'Free (one of your first 2)' : '$7.99';
  openSheet('Request a new estimate', `
   <div style="font-size:13.5px;color:var(--mute);margin:-4px 2px 4px">Fill in what you know. It opens a ready-to-send email to DuPage Quotes, and your branded quote comes back in about 5 minutes. <b style="color:var(--ink)">${fee}</b></div>
   <label class="fl">Client name</label><input class="tx" id="r1" placeholder="e.g. Maria Lopez">
   <label class="fl">Job address</label><input class="tx" id="r2" placeholder="Street, city">
   <label class="fl">Client email (optional)</label><input class="tx" id="r3" placeholder="client@email.com" inputmode="email">
   <label class="fl">The job – what you'll do</label><textarea class="nt" id="r4" rows="3" placeholder="e.g. Replace 2 rotted deck boards, re-stain…"></textarea>
   <label class="fl">Your price</label><input class="tx" id="r5" placeholder="$" inputmode="decimal">
   <div class="btns" style="grid-template-columns:1fr;margin-top:16px"><button class="btn pri" data-act="reqsend">Open email to DuPage Quotes</button></div>`);
}

/* ---------- actions ---------- */
function nudge(q){
  const n = (c(q).name||'').split(/[ &]/)[0] || 'there';
  const msg = `Hi ${n}, just checking in on the ${D.doc_title?D.doc_title.toLowerCase():'quote'} for ${q.project}. You can review and accept it here: ${pubLink(q)} – ${first||D.contractor}`;
  if (navigator.share) navigator.share({ text: msg }).catch(()=>{});
  else if (c(q).email) location.href = `mailto:${encodeURIComponent(c(q).email)}?subject=${encodeURIComponent('Your '+(D.doc_title?D.doc_title.toLowerCase():'quote')+' from '+D.contractor)}&body=${encodeURIComponent(msg)}`;
  else copyText(msg, 'Message copied – paste it in a text ✓');
}
function adjust(q){
  const body = `Hi David,\n\nPlease adjust ${q.quote_no} for ${c(q).name} (${q.project}).\n\nWhat to change:\n\n\n– ${D.contractor}`;
  location.href = `mailto:dupagequotes@gmail.com?subject=${encodeURIComponent('Adjust quote '+q.quote_no+' – '+D.contractor)}&body=${encodeURIComponent(body)}`;
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, q = el.dataset.q ? Q.find(x=>x.quote_no===el.dataset.q) : null;
  if (el.tagName==='A' && act!=='job') return;            // normal links (maps, view quote)
  ev.preventDefault();
  if (act==='tab') { S.tab=+el.dataset.v; haptic(); document.getElementById('thumb').style.transform=`translateX(${S.tab*100}%)`;
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b===el));
    ['p-sched','p-wait','p-all'].forEach((id,j)=>{ const p=document.getElementById(id); p.classList.toggle('on', j===S.tab); p.classList.remove('rise'); }); }
  else if (act==='day') { S.day = S.day===el.dataset.v ? '' : el.dataset.v; S.tab=0; haptic(); render(); document.getElementById('seg').scrollIntoView({behavior:'smooth',block:'start'}); }
  else if (act==='who') { S.who = el.dataset.v; S.tab=0; haptic(); render(); }
  else if (act==='clear') { S.day=''; S.who=''; render(); }
  else if (act==='copy') copyText(el.dataset.v, /^https?:/.test(el.dataset.v)?'Link copied ✓':'Address copied ✓');
  else if (act==='date' && q) pickDate(q.sd, v => { save(q,{start_date:v},'Start date saved ✓'); render(); });
  else if (act==='job' && q) jobSheet(q);
  else if (act==='nudge' && q) nudge(q);
  else if (act==='adjust' && q) adjust(q);
  else if (act==='close') closeSheet();
  else if (act==='bell') bellSheet();
  else if (act==='search') searchSheet();
  else if (act==='req') reqSheet();
  else if (act==='reqsend') { const v = id => document.getElementById(id).value.trim();
    const body = `New job for DuPage Quotes\n\nContractor: ${D.contractor}\nClient: ${v('r1')}\nAddress: ${v('r2')}\nClient email: ${v('r3')}\nJob: ${v('r4')}\nPrice: ${v('r5')}\n`;
    location.href = `mailto:dupagequotes@gmail.com?subject=${encodeURIComponent('New quote – '+D.contractor+(v('r1')?' – '+v('r1'):''))}&body=${encodeURIComponent(body)}`; }
  else if (act==='crewt') { const jq = Q.find(x=>x.quote_no===sheet.dataset.q); if(!jq) return; const n = el.dataset.v; const cur = new Set(jq.crew||[]);
    cur.has(n) ? cur.delete(n) : cur.add(n); el.classList.toggle('on'); haptic(); save(jq,{crew:[...cur]},'Crew updated ✓'); render(); }
  else if (act==='crewadd') { const n = (prompt('Crew member name') || '').trim().slice(0,30); if(!n) return; if(!CREW.includes(n)) { CREW.push(n); saveCrew(); }
    const jq = Q.find(x=>x.quote_no===sheet.dataset.q); if (jq) { const cur=new Set(jq.crew||[]); cur.add(n); save(jq,{crew:[...cur]},'Added '+n+' ✓'); render(); jobSheet(jq); } }
});
render();
(window.onReady = window.onReady || []).push(()=>setTimeout(()=>{
  const b=document.getElementById('bars'); if(b) b.classList.add('go');
  document.querySelectorAll('[data-to]').forEach(el=>{ const to=+el.dataset.to, money=el.dataset.fmt==='$', t0=performance.now(), dur=900;
    const f=t=>{ const k=Math.min(1,(t-t0)/dur), v=to*(1-Math.pow(1-k,4)); el.textContent = money?m0(v):Math.round(v); if(k<1) requestAnimationFrame(f); };
    requestAnimationFrame(f); });
}, 250));
if (!document.getElementById('k-rev')) { document.body.classList.add('ready'); window.onReady.forEach(f=>f()); }

hideLoad();
})();
</script>
</body></html>
