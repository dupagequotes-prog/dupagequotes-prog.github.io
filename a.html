/* DuPage Quotes – David's own page (HQ). DuPage brand: navy #222B45 + orange #E8913F */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:20px 20px;mask-image:linear-gradient(to bottom,#000,transparent 85%);-webkit-mask-image:linear-gradient(to bottom,#000,transparent 85%)}

.kpi.hot{background:linear-gradient(160deg,var(--o),#c96f22);color:#fff;border-color:transparent}.kpi.hot .l,.kpi.hot small{color:rgba(255,255,255,.85)}
.seg{position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:5;margin:16px 0 12px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:4px}

.card{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:12px;animation:in .35s var(--ease) both}

.rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

.t-new{background:#fff1e3;color:#b4570f}.t-work{background:#e8edff;color:#3346a8}.t-done{background:#e6f6ec;color:#15803d}.t-wait{background:#fff4e0;color:#a15c00}.t-view{background:#eef0f6;color:#3c4257}

.voice{margin-top:10px;background:#fff8f0;border:1px dashed var(--o);border-radius:14px;padding:10px 12px;font-size:14px;white-space:pre-wrap}

.addr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.mb{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;font:600 12px Inter,sans-serif;color:var(--n);text-decoration:none;cursor:pointer;white-space:nowrap}

.btn:active{transform:scale(.96)}.pri{background:var(--n);color:#fff}.org{background:var(--o);color:#fff}.sec{background:#eef0f6;color:var(--ink)}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}.phs a{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e3e5ee}.phs img{width:100%;height:100%;object-fit:cover}
audio{width:100%;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:14px;background:#eef0f6;color:var(--n);flex:none}
.mid{flex:1;min-width:0}.mid .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mid .s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right;flex:none}.r .num{font-weight:700}
.empty{color:var(--mute);text-align:center;padding:22px 0}
.filter{display:flex;gap:8px;overflow-x:auto;margin:-2px 0 12px;scrollbar-width:none}.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:600 13px Inter,sans-serif;color:var(--mute);cursor:pointer}.filter button.on{background:var(--n);color:#fff;border-color:var(--n)}
.t-ready{background:#efe6ff;color:#6b21a8}
.pv{margin-top:12px;border:1.5px solid var(--c);border-radius:16px;overflow:hidden}
.pvh{background:var(--c);color:#fff;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:12px}.pvh span{font-weight:700;letter-spacing:.03em}
.pvb{padding:10px 14px 12px;font-size:14px}.pvc{color:var(--mute);font-size:13px}.pvc b{color:var(--ink)}.pvp{font-weight:700;font-size:15.5px;margin:6px 0 2px;color:var(--c)}
.pvb ul{margin:6px 0 8px;padding-left:18px}.pvb li{margin:3px 0}.pvb i{font-style:normal;color:var(--mute);font-weight:600}
.pvt{display:flex;justify-content:space-between;border-top:2px solid var(--c);padding-top:6px;font-size:15px}.pvt b{color:var(--c)}.pvd{font-size:12.5px;color:var(--mute);margin-top:3px}
.wait{margin-top:10px;font-size:13px;color:#6b21a8;background:#f6f0ff;border-radius:10px;padding:8px 10px}.wait.idle{color:var(--mute);background:#f3f4f8}.wait.ok{color:#15803d;background:#ecf8f0}.wait a{color:inherit;font-weight:700}
.fl{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 2px 4px}
.tx{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:500 14.5px Inter,-apple-system,sans-serif;background:#fff;outline:none;resize:vertical}.tx:focus{border-color:var(--n);box-shadow:0 0 0 3px rgba(34,43,69,.12)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ln{position:relative;border:1px dashed var(--line);border-radius:12px;padding:8px 34px 8px 8px;margin-bottom:8px;display:grid;gap:6px}.ln .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;border-radius:50%;background:#eef0f6;cursor:pointer;font-size:15px}
.ln .lead{font-weight:700}.ln.it{grid-template-columns:1fr}.btn.sm{padding:7px 11px;font-size:12.5px}
.kav{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;background:#fff;border:2px solid var(--kc,#222B45);overflow:hidden;font-weight:800;font-size:14px;color:var(--kc,#222B45)}.kav img{width:100%;height:100%;object-fit:contain;padding:3px}.kav.sm{width:30px;height:30px;border-radius:9px;font-size:11px}
.kq{border-left:4px solid var(--kc);padding-left:10px;margin-left:-6px}.kname{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--kc)}.kname i{width:8px;height:8px;border-radius:50%;background:var(--kc)}
.card.kc{border-top:4px solid var(--kc)}.qrow{display:flex;align-items:center;gap:12px;padding:12px 0 12px 10px;border-top:1px solid var(--line);border-left:4px solid var(--kc);margin-left:-16px;padding-left:12px}.qrow:first-child{border-top:0}
.qacts{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px 54px}.kcard{display:flex;gap:12px;align-items:center}.kcard .mid .n{font-size:16px;color:var(--kc)}
.filter button i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--kc);margin-right:6px}.filter button.on i{box-shadow:0 0 0 2px #fff}
.lk{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--ks,#f4f6fa);border:1px solid var(--line);margin:10px 0}.lk .t{font-weight:800;font-size:17px;color:var(--kc)}.lk .d{margin-left:auto;font-weight:800;letter-spacing:2px;color:var(--kc)}
input[type=color].tx{height:44px;padding:4px}.newbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.bld{border:2px solid var(--c,#222B45)}.bld .bh{display:flex;align-items:center;gap:10px;margin:-4px 0 6px}.bld .sw{width:14px;height:14px;border-radius:4px;background:var(--c)}
.btn.del{color:#b42318;margin-left:auto}.askw{position:fixed;inset:0;z-index:80;background:rgba(18,23,38,.45);display:grid;place-items:center;padding:20px}.askb{background:#fff;border-radius:20px;padding:18px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}.askm{white-space:pre-wrap;font-size:15px;line-height:1.45}.askb .acts{justify-content:flex-end}
.sendbox{margin-top:10px;background:#f6f7fb;border-radius:12px;padding:2px 12px 10px}.hint{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.45}.made{border:2px solid #16a34a}.made .acts{margin-top:10px}select.tx{appearance:auto}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:10px}.orig{margin-top:10px;font-size:13px;color:var(--mute)}.orig summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);z-index:60;background:#111317;color:#fff;border-radius:99px;padding:10px 16px;font:600 13.5px Inter,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .4s var(--spring);white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* DuPage Quotes loading screen v2 – navy #222B45 + orange #E8913F */
#dq-load{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;
  background:radial-gradient(60% 45% at 50% 38%,rgba(232,145,63,.22) 0%,rgba(232,145,63,0) 70%),radial-gradient(120% 80% at 50% 120%,#141a2e 0%,transparent 60%),#222B45;
  font-family:Poppins,-apple-system,Helvetica,Arial,sans-serif;transition:opacity .6s cubic-bezier(.23,1,.32,1),visibility .6s,transform .6s cubic-bezier(.23,1,.32,1),filter .6s}
#dq-load:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;
  mask-image:radial-gradient(circle at 50% 42%,black 0%,transparent 65%);-webkit-mask-image:radial-gradient(circle at 50% 42%,black 0%,transparent 65%)}
#dq-load.hide{opacity:0;visibility:hidden;transform:scale(1.06);filter:blur(6px)}
#dq-load .tile{position:relative;width:124px;height:124px;border-radius:34px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 24px 60px -18px rgba(0,0,0,.6),0 0 80px -10px rgba(232,145,63,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:dqpop .8s cubic-bezier(.34,1.4,.64,1) both}
#dq-load .tile:after{content:"";position:absolute;inset:-2px;border-radius:36px;padding:2px;background:conic-gradient(from var(--dqa,0deg),transparent 0 70%,#E8913F 85%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:dqspin 1.6s linear infinite}
@property --dqa{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes dqspin{to{--dqa:360deg}}
#dq-load .lg{width:92px;height:92px;animation:dqfloat 3s ease-in-out .8s infinite}
#dq-load .wm{font-size:38px;font-weight:700;line-height:1;color:#fff;letter-spacing:-1px;margin-top:26px;animation:dqfade .7s .15s cubic-bezier(.23,1,.32,1) both}
#dq-load .wq{font-size:14px;font-weight:600;color:#E8913F;letter-spacing:.5em;margin:8px 0 0 .5em;animation:dqfade .7s .22s cubic-bezier(.23,1,.32,1) both}
#dq-load .tg{font-size:13px;margin-top:26px;font-family:-apple-system,Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:.01em;
  background:linear-gradient(90deg,#8d95b3 0%,#fff 50%,#8d95b3 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:dqfade .7s .3s cubic-bezier(.23,1,.32,1) both,dqshine 2.2s linear infinite}
#dq-load .lbar{display:none}
@keyframes dqshine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes dqpop{from{transform:scale(.6) translateY(10px);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
@keyframes dqfloat{50%{transform:translateY(-4px)}}
@keyframes dqfade{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){#dq-load *{animation:none!important}}

(async()=>{

let OWN = ''; let D = D0, TAB = 0, RF = 'open', SEEN = null; const EDIT = {}, BUILD = {}; let MADE = [], QF = '';

const e = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let tt; const toast = m => { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); };

function ask(msg, yes){ if (IS_MGR()) msg = String(msg).replace(/\bHQ\b/g, 'your page');   // HQ's own confirm box (browser pop-ups get blocked in some apps)
  return new Promise(done => { const w = document.createElement('div'); w.className = 'askw';
    w.innerHTML = `<div class="askb"><div class="askm"></div><div class="acts"><button class="btn sec" data-no>Cancel</button><button class="btn org" data-yes>${e(yes||'Yes')}</button></div></div>`;
    w.querySelector('.askm').textContent = msg; document.body.appendChild(w);

    w.querySelector('[data-yes]').onclick = ev => { ev.stopPropagation(); end(true); };
    w.querySelector('[data-no]').onclick = ev => { ev.stopPropagation(); end(false); };
    w.onclick = ev => { if (ev.target === w) end(false); }; }); }
function themeOf(tok){ const qs = (D.quotes||[]).filter(q=>q.contractor_token===tok); const last = qs[qs.length-1]||{}, lk = kOf(tok).look||{};
  const th = lk.theme || last.theme || {}; return { p: th.p||'#222B45', a: th.a||th.p||'#222B45', s: th.s||'#F4F6FA', doc: lk.doc_title||last.doc_title||'QUOTE' }; }

const soft = hx => { const n = parseInt(hx.slice(1),16), m = c => Math.round(c + (255-c)*.93); return '#'+[n>>16&255,n>>8&255,n&255].map(m).map(v=>v.toString(16).padStart(2,'0')).join(''); };

const TT = (key, def) => (IS_MGR() && D.manager && D.manager.text && D.manager.text[key]) || def;   // words David set for this manager's page (live)
const brandHTML = t => { const w = String(t).trim().split(/\s+/); const last = w.pop(); return (w.length ? e(w.join(' ')) + ' ' : '') + '<span>' + e(last) + '</span>'; };
const mgrTitle = () => TT('title', ((D.manager||{}).name||'') + '’s Quotes');
const WORDS = [['title','Page name (big title)','e.g. Alonzo’s Quotes'],['greeting','Greeting name','Name after “Good evening,”'],['subtitle','Small line under the title','optional'],['tab_requests','Tab: Requests','Requests'],['tab_quotes','Tab: Quotes','Quotes'],['tab_contractors','Tab: Contractors','Contractors'],['tab_activity','Tab: Activity','Activity'],['new_quote','Button: New quote','New quote']];
function wordsForm(m){ const t = m.text||{};

   <div class="acts" style="margin-top:12px"><button class="btn pri" data-act="wsave" data-v="${e(m.id)}">Save</button><button class="btn sec" data-act="wcancel">Cancel</button></div></div>`; }
const hq = body => fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({k:K}, body))}).then(r=>r.json()).then(j=>{ if (!j.ok) throw new Error(j.error||'error'); return j; });
const MONTH = () => String(D.today||'').slice(0,7), MONTHNAME = () => new Date((MONTH()||'2026-01')+'-15T12:00:00').toLocaleDateString('en-US',{month:'long'});

  return `<div class="acts" style="align-items:center;margin-top:8px"><span style="font-size:13px;font-weight:600">💳 Monthly</span><input class="tx" style="max-width:110px;width:110px" type="number" min="0" step="1" inputmode="decimal" placeholder="${e(dm!==''&&dm!=null?dm:'$')}" value="${pl.monthly==null?'':e(pl.monthly)}" data-plan="${e(k.token)}">
   <button class="btn ${paid?'pri':'sec'}" data-act="plpaid" data-v="${e(k.token)}" data-p="${paid?0:1}">${paid?'✓ Paid for '+MONTHNAME():'Mark paid for '+MONTHNAME()}</button></div>`; };
const planTotals = ks => { let exp = 0, got = 0; ks.forEach(k => { const pl = k.plan; if (pl && pl.monthly != null) { exp += Number(pl.monthly); if (pl.paid) got += Number(pl.monthly); } }); return {exp, got}; };
function contactForm(tok){   // managers (and David) edit a contractor's contact info only

     ${rows||'<div class="card"><div class="empty">No active managers.</div></div>'}
     ${off.length?`<details class="card" style="padding:12px 16px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Switched-off managers (${off.length})</summary><div style="margin-top:10px">${off.map(card).join('')}</div></details>`:''}
     <div class="card"><div class="rh"><div class="who">What managers did lately</div></div>${au||'<div class="empty">Nothing yet.</div>'}</div>`;
}
function accessForm(m){   // David: a manager's email (alerts) and team-lead access
  return `<div class="card" id="ma_${e(m.id)}"><div class="rh"><div class="who">🔑 ${e(m.name)} – email & access</div></div>

const pcur = x => x==null||x===''?'':(/^[0-9]/.test(String(x))?'$'+e(x):e(x));

  else if (act==='aopen') { EDIT['ma_'+v] = true; render(); const c = document.getElementById('ma_'+v); if (c) c.scrollIntoView({behavior:'smooth'}); }
  else if (act==='masave') { const em = (document.getElementById('ma_e_'+v)||{}).value||'', ld = !!(document.getElementById('ma_l_'+v)||{}).checked; el.disabled = true;

  else if (act==='tsend') { const q = ((D.shared||{}).quotes||[]).find(z=>z.quote_no===v); if (!q) return; const cE = (q.client||{}).email||''; if (!cE) { toast('This client has no email on file'); return; }
    if (!await ask(`Email quote ${q.quote_no} to ${(q.client||{}).name||'the client'} (${cE})?\n\nIt goes out right now from ${q.contractor}.`)) return;

  else if (act==='mgrdelete') { const m = (D.managers||[]).find(z=>z.id===v); if (!m) return;

    const typed = prompt(`DELETE ${m.name} AND EVERYTHING?\n\nThis permanently removes:\n• ${m.name}’s page link\n• ${cs.length} contractor${cs.length===1?'':'s'} and their dashboards/links\n• ${nq} quote${nq===1?'':'s'} (client links stop working)\n• ${nr} request${nr===1?'':'s'}\n\nA private backup file is saved to Drive first. This cannot be undone.\n\nType “${m.name}” to confirm:`);

  else if (act==='mgrrevoke' || act==='mgrenable' || act==='mgrrotate') { const sub = act==='mgrrevoke'?'revoke':act==='mgrenable'?'enable':'rotate';
    if (sub!=='enable' && !confirm(sub==='revoke'?'Switch this manager’s link off? They lose access immediately.':'Make a new link? The old one stops working immediately.')) return;
    hq({action:'admin_mgr', sub, id:v}).then(j=>{ if (sub==='rotate') { toast('New link copied ✓'); try { const m=(D.managers||[]).find(z=>z.id===v); navigator.clipboard.writeText(site()+'a.html?k='+encodeURIComponent(j.token)); } catch(x) {} } else toast('Done ✓'); refresh(true); }).catch(y=>toast('Not saved: '+(y.message||y))); }
  else if (act==='lkcancel') { delete EDIT['k_'+v]; delete BUILD['k_'+v]; render(); }

    if (f.p !== (mt.p||'').toLowerCase() || f.a !== (mt.a||'').toLowerCase()) look.theme = { p:f.p, a:f.a, s:soft(f.p), f:(mt.f||'Helvetica, Arial, sans-serif') };
    ['doc_title','contact','phone','email','payment','language'].forEach(x=>{ if (f[x] && f[x] !== String(mac[x]==null?'':mac[x])) look[x] = f[x]; });
    if (f.deposit_pct !== '' && String(f.deposit_pct) !== String(mac.deposit_pct==null?'':mac.deposit_pct)) look.deposit_pct = Number(f.deposit_pct);
    el.disabled = true; el.textContent = 'Saving…';
    try { const r = await fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'admin_look', k:K, token:v, look, logo:lg||''})}); const j = await r.json();
      if (!j.ok) { toast('Not saved: '+(j.error||'try again')); el.disabled=false; el.textContent='Save'; return; }
      delete EDIT['k_'+v]; delete BUILD['k_'+v]; toast('🎨 '+k.contractor+' updated everywhere ✓'); refresh(true); }
    catch(y) { toast('No connection – not saved'); el.disabled=false; el.textContent='Save'; } }
  else if (act==='bcancel') { delete BUILD[v]; delete EDIT[v]; render(); }
  else if (act==='unmade') { MADE = MADE.filter(m=>m.quote_no!==v); render(); }
  else if ((act==='create' || act==='bpolish' || act==='bdraft') && BUILD[v]) { const pj = readBuilder(v), tok = BUILD[v].tok, k = (D.contractors||[]).find(z=>z.token===tok)||{};
    if (act==='bpolish' || act==='bdraft') { const pol = act==='bpolish', r = (D.requests||[]).find(z=>z.id===v); if (r) { r.polished = pj; r.polish = pol?'Requested':'Ready'; } delete BUILD[v]; delete EDIT[v]; render();
      post(Object.assign({action:'admin_draft', k:K, job:pj, polish:pol}, r ? {request_id:v} : {contractor_token:tok}), pol ? '✨ Saved – Claude cleans up the wording on the next run ✓' : '💾 Draft saved – it’s in Requests ✓'); if (!r) setTimeout(()=>refresh(true), 1500); return; }
    if (!pj.client.name) { toast('Add the client name'); return; }
    if (!(pj.price > 0)) { toast('Add the total price'); return; }
    if (!pj.items.length) { toast('Add at least one item'); return; }
    const withAmt = pj.items.filter(i=>i.amount!=null), sumA = withAmt.reduce((t,i)=>t+Number(i.amount||0),0);
    if (withAmt.length === pj.items.length && Math.abs(sumA - pj.price) > 0.5) { toast(`Lines add up to ${m0(sumA)}, total is ${m0(pj.price)} – fix one`); return; }
    const okE = x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(x||'').trim()), kE = (k.look||{}).email || k.email || '';
    const sc = document.getElementById('sc_cl_'+v), sk = document.getElementById('sc_k_'+v), send = { client: !!(sc&&sc.checked&&okE(pj.client.email)), contractor: !!(sk&&sk.checked&&okE(kE)) };
    if (sc && sc.checked && !okE(pj.client.email)) { toast('Add the client email, or untick “Email it to the client”'); return; }
    const who = [send.client&&`${pj.client.name} (${pj.client.email})`, send.contractor&&`${k.contractor} (${kE})`].filter(Boolean);
    if (!await ask(`Generate the final ${k.contractor} quote for ${pj.client.name} – ${m0(pj.price)}?\n\nIt goes online now${who.length?' and gets emailed to:\n• '+who.join('\n• '):' (no emails – you share the link yourself)'}.`, '🚀 Generate')) return;
    el.disabled = true; el.textContent = 'Generating…';
    try { const r = await fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'admin_create_quote', k:K, contractor_token:tok, request_id: v==='new'?'':v, job:pj, send})}); const j = await r.json();
      if (!j.ok) { toast('Not made: '+(j.error||'try again')); el.disabled=false; el.textContent='🚀 Generate pro online quote'; return; }
      const link = site()+'q.html?q='+encodeURIComponent(j.quote_no)+'&t='+encodeURIComponent(j.token);
      MADE.unshift({ quote_no:j.quote_no, contractor:k.contractor, client:pj.client.name, price:pj.price, link, view: link+'&src=k', sent: Object.values(j.sent||{}), mailErr: j.mail_error||'',
        msg:`Hi${k.contact?' '+String(k.contact).split(' ')[0]:''}! Your quote ${j.quote_no} for ${pj.client.name} (${m0(pj.price)}) is ready. Send this link to your client – they can read it and sign online:\n${link}` });
      delete BUILD[v]; delete EDIT[v]; toast('✅ '+j.quote_no+' is online'+(j.sent&&Object.keys(j.sent).length?' and emailed':'')); refresh(true); render(); scrollTo({top:0,behavior:'smooth'});
    } catch(y) { toast('No connection – not made'); el.disabled=false; el.textContent='🚀 Generate pro online quote'; } }
  else if (act==='editraw') { EDIT[v]='raw'; render(); }
  else if (act==='editquote') { EDIT[v]='quote'; render(); }
  else if (act==='cancel') { delete EDIT[v]; render(); }
  else if (act==='rmline') el.closest('.ln').remove();
  else if (act==='addline') { const box = document.getElementById(v); const it = v.startsWith('it_');
    box.insertAdjacentHTML('beforeend', it ? '<div class="ln it"><input class="tx lead" placeholder="Item"><textarea class="tx" rows="2" placeholder="Description"></textarea><input class="tx amt" placeholder="$ (optional)"><button class="x" data-act="rmline">×</button></div>'
      : '<div class="ln"><input class="tx lead" placeholder="Heading"><textarea class="tx" rows="2" placeholder="Details"></textarea><button class="x" data-act="rmline">×</button></div>'); }
  else if (act==='saveraw' && x) { const card = document.getElementById('rq_'+v), f = {}; card.querySelectorAll('[data-f]').forEach(i=>f[i.dataset.f]=i.value.trim());
    const rp = document.getElementById('rp_'+v).checked; Object.assign(x, f); if (rp) x.polish='Requested'; delete EDIT[v]; render();
    post({action:'admin_req_edit', k:K, id:v, fields:f, repolish:rp}, rp?'Saved – it will be polished again ✓':'Saved ✓'); }
  else if (act==='savequote' && x) { const card = document.getElementById('rq_'+v), pj = JSON.parse(JSON.stringify(x.polished||{}));
    card.querySelectorAll('[data-q]').forEach(i=>{ const path=i.dataset.q.split('.'), val=i.value.trim(); if(path.length===2){ pj[path[0]]=pj[path[0]]||{}; pj[path[0]][path[1]]=val; } else pj[path[0]]=val; });
    pj.price = pj.price===''? '' : Number(String(pj.price).replace(/[$,\s]/g,'')); pj.deposit_pct = pj.deposit_pct===''? undefined : Number(pj.deposit_pct);
    const sc = document.getElementById('sc_'+v); if (sc) pj.scope = [...sc.querySelectorAll('.ln')].map(l=>({lead:l.querySelector('.lead').value.trim(), text:l.querySelector('textarea').value.trim()})).filter(l=>l.lead||l.text);
    pj.items = [...document.getElementById('it_'+v).querySelectorAll('.ln')].map(l=>{ const am=l.querySelector('.amt').value.replace(/[$,\s]/g,''); const o={title:l.querySelector('.lead').value.trim(), description:l.querySelector('textarea').value.trim()}; if(am!=='') o.amount=Number(am); else o.detail='Included'; return o; }).filter(i=>i.title||i.description);
    if (!pj.items.length) { toast('Add at least one item'); return; }
    if (pj.items.length === 1 && pj.items[0].amount != null && pj.price !== '') pj.items[0].amount = pj.price;   // one line: keep it equal to the total
    const withAmt = pj.items.filter(i=>i.amount!=null), sumA = withAmt.reduce((t,i)=>t+Number(i.amount||0),0);
    if (withAmt.length === pj.items.length && pj.items.length > 1 && pj.price !== '' && Math.abs(sumA - pj.price) > 0.5 && !await ask(`The line amounts add up to ${m0(sumA)} but the total is ${m0(pj.price)}. Save anyway? (It won't be built until they match.)`)) return;
    x.polished = pj; x.polish='Ready'; delete EDIT[v]; render(); post({action:'admin_req_edit', k:K, id:v, polished:pj}, 'Quote saved ✓'); }
  else if (act==='polish' && x) { x.polish='Requested'; render(); post({action:'admin_req_edit', k:K, id:v, repolish:true}, '✨ Polishing – ready on the next run ✓'); }
  else if (act==='repolish' && x) { x.polish='Requested'; render(); post({action:'admin_req_edit', k:K, id:v, repolish:true}, 'Will be re-polished on the next run ✓'); }

  else if (act==='audio' && x) { const box = document.getElementById('media_'+v); el.textContent = 'Loading…'; try { const src = await getFile(x.audio); box.insertAdjacentHTML('beforeend', `<audio controls autoplay src="${src}"></audio>`); el.remove(); } catch(y) { el.textContent = 'Could not load'; } }
  else if (act==='photos' && x) { const box = document.getElementById('media_'+v); el.textContent = 'Loading…'; box.insertAdjacentHTML('beforeend', '<div class="phs"></div>'); const g = box.querySelector('.phs');

});
document.addEventListener('change', async ev => { const el = ev.target;
  if (el.dataset.logo && el.files && el.files[0]) { const tok = el.dataset.logo; try { const d = await shrinkLogo(el.files[0]); const f = readLook(tok); BUILD['k_'+tok] = Object.assign(f, {logo:d});

render();
{ const rid = P.get('r'); if (rid && IS_MGR() && D.shared) { TAB = 4; render(); setTimeout(() => { const c = document.getElementById('tr_'+rid); if (c) { c.scrollIntoView({behavior:'smooth', block:'center'}); c.style.boxShadow = '0 0 0 3px #E8913F'; } }, 400); } }   // alert-email link: opens the Team tab on that request
setInterval(() => { if (!document.hidden) refresh(false); }, 30000);

hideLoad();
