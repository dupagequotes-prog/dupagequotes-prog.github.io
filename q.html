<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9ECEA;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#1f2723;font-size:15px;line-height:1.45}
.bar{max-width:8.5in;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#5d6862}
.bar button{border:1px solid #c9d1cd;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
.paper{max-width:8.5in;margin:12px auto 40px;background:#fff;box-shadow:0 6px 30px rgba(0,0,0,.12);border-radius:4px;padding:44px 48px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:4px solid var(--p);padding-bottom:14px}
.id{display:flex;gap:12px;align-items:center}.badge{width:54px;height:54px;border-radius:10px;background:var(--p);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.logo{max-width:150px;max-height:70px;object-fit:contain}
.biz{font-family:var(--f);font-size:23px;font-weight:700;color:var(--p);line-height:1.15}.ct{font-size:12.5px;color:#5d6862}
.qt{text-align:right;font-size:12.5px;color:#5d6862;white-space:nowrap}.qt b{display:block;font-family:var(--f);font-size:28px;letter-spacing:2px;color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
h4{margin:0 0 3px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--a)}
table{width:100%;border-collapse:collapse}th{background:var(--p);color:#fff;text-align:left;padding:8px 11px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
td{padding:10px 11px;border-bottom:1px solid #e2e7e4;vertical-align:top}td:last-child{width:32%}
.tot{margin:16px 0 0 auto;max-width:330px}.tot div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e7e4}
.tot .big{font-size:20px;font-weight:800;color:var(--p);border-bottom:3px solid var(--a)}
.terms{font-size:13px;background:var(--s);padding:11px 13px;border-radius:6px;margin-top:16px}
.sig{display:grid;grid-template-columns:1.25fr 1fr;gap:30px;margin-top:34px;align-items:end}
.sigbox{border:2px dashed var(--a);border-radius:10px;padding:14px;background:#FFFCF5}
.sigbox label.t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--a);font-weight:700}
.sigbox input[type=text]{width:100%;border:0;border-bottom:1.5px solid #333;font-size:18px;padding:8px 2px 6px;margin:6px 0 4px;background:transparent;outline:none}
.preview{font-family:'Dancing Script',cursive;font-size:30px;color:#1b2f8a;min-height:40px;line-height:1.2}
.agree{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:10px 0 12px}.agree input{width:20px;height:20px;margin-top:1px;flex:none}
.accept{width:100%;background:var(--p);color:#fff;border:0;border-radius:9px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}
.accept:disabled{opacity:.45;cursor:not-allowed}
.err{color:#b3261e;font-size:13px;margin-top:6px;min-height:16px}
.done{border:2px solid #2E7D4F;background:#F0FAF3;border-radius:10px;padding:14px}
.done .preview{color:#1b2f8a}.done small{display:block;color:#2E7D4F;font-weight:700;font-size:13px;margin-top:4px}
.ksig{border-top:1px solid #333;padding-top:6px;font-size:12.5px;color:#5d6862}
.ksig .preview{font-size:24px;color:#333}
.stamp{display:inline-block;background:#2E7D4F;color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;padding:5px 11px;border-radius:5px;margin-left:8px;vertical-align:middle}
.foot{text-align:center;font-size:12px;color:#7a8781;margin:-26px 0 30px}
@media(max-width:640px){.paper{padding:22px 16px;margin:8px 6px 30px;overflow-wrap:anywhere}td:last-child{width:38%}.tot{max-width:none}.bar{padding:10px 10px 0}.grid,.sig{grid-template-columns:1fr}.top{flex-direction:column}.qt{text-align:left}.biz{font-size:20px}}
@media print{body{background:#fff}.bar,.foot,.sigbox .agree,.accept,.err{display:none}.paper{box-shadow:none;margin:0;max-width:none;padding:.5in}}
</style></head>
<body>
<div class="bar"><span id="barTxt"></span><button onclick="window.print()" id="printBtn"></button></div>
<div class="paper" id="paper"></div>
<div class="foot">Quote prepared by DuPage Quotes for the contractor above · dupagequotes@gmail.com</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbyhZMVpTW09drWGodTUBtjCvWqbxEt29fpmDgbzyaaY91habK3yg_oRDaRf8U9Ehyyi/exec";
const P = new URLSearchParams(location.search);
async function api(params){ const r = await fetch(API + '?' + new URLSearchParams(params), {credentials:'omit'}); return r.json(); }
function fail(msg){ document.body.innerHTML = '<div style="font-family:-apple-system,Helvetica,Arial;max-width:520px;margin:60px auto;padding:0 20px;color:#333"><h2>DuPage Quotes</h2><p>'+msg+'</p></div>'; }
(async()=>{
const j = await api({api:'quote', q:P.get('q')||'', t:P.get('t')||''});
if(!j.ok){ fail(j.error||'This quote link is not valid. Please contact your contractor.'); return; }
const D = j.data; document.title = 'Quote ' + D.quote_no + ' – ' + D.contractor;


const TH = {Classic:{p:'#234E3A',a:'#C8892B',s:'#F3F6F4',f:"Georgia,'Times New Roman',serif"},
            Modern:{p:'#1B2A41',a:'#F26B21',s:'#F4F6FA',f:"-apple-system,Helvetica,Arial,sans-serif"},
            Simple:{p:'#0F7C80',a:'#0F7C80',s:'#F2F8F8',f:"-apple-system,Helvetica,Arial,sans-serif"}};
const T = {English:{quote:'QUOTE',no:'No.',date:'Date',valid:'Valid for 30 days',prep:'Prepared for',proj:'Project',start:'Planned start',scope:'Scope of work',det:'Details',total:'Total price',dep:'Deposit due to schedule',bal:'Balance due on completion',pay:'Payment',paytxt:'Deposit reserves your start date; balance due the day the work is completed. Any changes to the scope will be agreed in writing before work begins.',inc:'Included',notes:'Notes',
  sigT:'Client signature – type your full name',ph:'Your full name',agree:'I accept this quote, the price and the payment terms above.',btn:'Accept quote',acc:'Accepted',accBy:'Accepted electronically',kT:'Contractor',print:'Download / print',bar:'Review your quote below, then sign at the bottom.',need:'Please type your full name and check the box.',thanks:'Thank you! Your contractor has been notified.',signedOn:'on'},
 Spanish:{quote:'COTIZACIÓN',no:'No.',date:'Fecha',valid:'Válida por 30 días',prep:'Preparada para',proj:'Proyecto',start:'Inicio planeado',scope:'Trabajo a realizar',det:'Detalles',total:'Precio total',dep:'Depósito para agendar',bal:'Saldo al terminar el trabajo',pay:'Pago',paytxt:'El depósito reserva su fecha de inicio; el saldo se paga el día que se termina el trabajo. Cualquier cambio al trabajo se acordará por escrito antes de empezar.',inc:'Incluido',notes:'Notas',
  sigT:'Firma del cliente – escriba su nombre completo',ph:'Su nombre completo',agree:'Acepto esta cotización, el precio y las condiciones de pago.',btn:'Aceptar cotización',acc:'Aceptada',accBy:'Aceptada electrónicamente',kT:'Contratista',print:'Descargar / imprimir',bar:'Revise su cotización y firme abajo.',need:'Escriba su nombre completo y marque la casilla.',thanks:'¡Gracias! Su contratista ya fue avisado.',signedOn:'el'}};
const th = TH[D.style] || TH.Classic, L = T[D.language] || T.English;
const r = document.documentElement.style; r.setProperty('--p',th.p); r.setProperty('--a',th.a); r.setProperty('--s',th.s); r.setProperty('--f',th.f);
const e = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m = x => '$'+Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById('barTxt').textContent = L.bar; document.getElementById('printBtn').textContent = L.print;
const c = D.client||{}, dep = Number(D.deposit_pct||0), price = Number(D.price);
const initials = (D.contractor.match(/[A-Za-z]+/g)||['Q']).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const items = D.items.map(i=>`<tr><td><b>${e(i.title)}</b>${i.description?'<br>'+e(i.description):''}</td><td>${e(i.detail || (i.amount!=null&&i.amount!==''?m(i.amount):L.inc))}</td></tr>`).join('');
function sigBlock(){
  if (D.status==='Accepted') return `<div class="done"><label class="t" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#2E7D4F;font-weight:700">${L.accBy}</label><div class="preview">${e(D.accepted_name)}</div><small>✓ ${L.acc} ${L.signedOn} ${e(D.accepted_at)}</small></div>`;
  return `<div class="sigbox"><label class="t" for="nm">${L.sigT}</label>
  <input type="text" id="nm" placeholder="${L.ph}" autocomplete="name" maxlength="80" value="">
  <div class="preview" id="pv"></div>
  <label class="agree"><input type="checkbox" id="ag"><span>${L.agree}</span></label>
  <button class="accept" id="go" disabled>${L.btn}</button><div class="err" id="err"></div></div>`;
}
function render(){
  document.getElementById('paper').innerHTML = `
  <div class="top"><div class="id">${D.logo?`<img class="logo" src="${D.logo}">`:`<div class="badge">${initials}</div>`}<div><div class="biz">${e(D.contractor)}</div><div class="ct">${[D.phone,D.email].filter(Boolean).map(e).join(' · ')}</div></div></div>
  <div class="qt"><b>${L.quote}</b>${L.no} ${e(D.quote_no)}<br>${L.date}: ${e(D.date)}<br>${L.valid}${D.status==='Accepted'?`<br><span class="stamp">✓ ${L.acc.toUpperCase()}</span>`:''}</div></div>
  <div class="grid"><div><h4>${L.prep}</h4><b>${e(c.name)}</b><br>${e(c.address)}${c.city?'<br>'+e(c.city):''}</div>
  <div><h4>${L.proj}</h4>${e(D.project)}${D.start?'<br>'+L.start+': '+e(D.start):''}</div></div>
  <table><tr><th>${L.scope}</th><th>${L.det}</th></tr>${items}</table>
  <div class="tot"><div class="big"><span>${L.total}</span><span>${m(price)}</span></div>
  ${dep?`<div><span>${L.dep} (${dep}%)</span><span>${m(price*dep/100)}</span></div><div><span>${L.bal}</span><span>${m(price-price*dep/100)}</span></div>`:''}</div>
  ${(D.payment||dep)?`<div class="terms"><b>${L.pay}:</b> ${D.payment?e(D.payment)+'. ':''}${dep?L.paytxt:''}</div>`:''}
  ${D.notes?`<div class="terms"><b>${L.notes}:</b> ${e(D.notes)}</div>`:''}
  <div class="sig">${sigBlock()}<div class="ksig"><div class="preview">${e(D.contact && !/owner/i.test(D.contact)?D.contact:'')}</div>${e(D.contact && !/owner/i.test(D.contact)?D.contact+', ':'')}${e(D.contractor)} · ${L.kT}</div></div>`;
  const nm=document.getElementById('nm'); if(!nm) return;
  const ag=document.getElementById('ag'), go=document.getElementById('go'), pv=document.getElementById('pv'), er=document.getElementById('err');
  const upd=()=>{pv.textContent=nm.value; go.disabled=!(nm.value.trim().length>=3 && ag.checked); er.textContent='';};
  nm.oninput=upd; ag.onchange=upd;
  go.onclick=()=>{ if(go.disabled){er.textContent=L.need;return;} go.disabled=true; go.textContent='…';
    const ok=res=>{D.status='Accepted'; D.accepted_name=res.name||nm.value; D.accepted_at=res.at||''; render(); const n=document.createElement('p'); n.style.cssText='color:#2E7D4F;font-weight:700;margin:12px 0 0'; n.textContent=L.thanks; document.querySelector('.done').appendChild(n);};
    const bad=err=>{go.disabled=false; go.textContent=L.btn; er.textContent=(err&&err.message)||L.need;};
    fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'accept',q:D.quote_no,t:D.token,name:nm.value,agreed:ag.checked})}).then(r=>r.json()).then(j=>j.ok?ok(j):bad({message:j.error})).catch(()=>bad({message:L.need}));
  };
}
render();

})();
</script>
</body></html>
