<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* DuPage Quotes – client quote page v2 (modern chrome, PDF-style paper in the contractor's colors) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ease:cubic-bezier(.23,1,.32,1);--line:rgba(15,17,21,.08)}
body{margin:0;background:color-mix(in srgb,var(--p,#234E3A) 6%,#eef0f2);font-family:Inter,-apple-system,Helvetica,Arial,sans-serif;color:#15181d;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.bar{position:sticky;top:0;z-index:5;max-width:none;margin:0;padding:10px max(16px,calc((100% - 8.5in)/2));display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:#4b515b;
  background:color-mix(in srgb,#fff 70%,transparent);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border-bottom:1px solid var(--line)}
.bar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font:600 13px Inter,-apple-system,sans-serif;color:#15181d;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .16s var(--ease)}
.bar button:active{transform:scale(.95)}
.paper{max-width:8.5in;margin:18px auto 40px;background:#fff;border-radius:18px;padding:44px 48px 40px;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(15,17,21,.04),0 8px 24px rgba(15,17,21,.06),0 30px 60px -20px rgba(15,17,21,.18);animation:up .7s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.99)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid var(--p);padding-bottom:16px}
.id{display:flex;gap:14px;align-items:center}.badge{width:56px;height:56px;border-radius:16px;background:var(--p);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.logo{max-width:150px;max-height:70px;object-fit:contain}
.biz{font-family:var(--f);font-size:23px;font-weight:700;color:var(--p);line-height:1.15;letter-spacing:-.01em}.ct{font-size:12.5px;color:#6b7079;margin-top:2px}
.qt{text-align:right;font-size:12.5px;color:#6b7079;white-space:nowrap;font-variant-numeric:tabular-nums}.qt b{display:block;font-family:var(--f);font-size:28px;letter-spacing:2px;color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.grid>div{background:var(--s);border-radius:12px;padding:12px 14px}
h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--a);font-weight:700}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:var(--p);color:#fff;text-align:left;padding:10px 13px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
td{padding:12px 13px;border-top:1px solid var(--line);vertical-align:top}tr:nth-child(odd) td{background:color-mix(in srgb,var(--s) 55%,white)}td:last-child{width:32%;color:#3a3f47}
.tot{margin:18px 0 0 auto;max-width:340px;font-variant-numeric:tabular-nums}.tot div{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tot .big{font-size:20px;font-weight:800;color:#fff;background:var(--p);border:0;border-radius:12px;padding:12px 14px;margin-bottom:4px;letter-spacing:-.01em}
.terms{font-size:13px;background:var(--s);padding:12px 14px;border-radius:12px;margin-top:14px;color:#3a3f47}
.sig{display:grid;grid-template-columns:1.25fr 1fr;gap:30px;margin-top:34px;align-items:end;scroll-margin-top:70px}
.sigbox{border:1.5px solid color-mix(in srgb,var(--a) 45%,white);border-radius:16px;padding:16px;background:color-mix(in srgb,var(--a) 5%,white);box-shadow:0 10px 30px -18px color-mix(in srgb,var(--a) 70%,black)}
.sigbox label.t{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--a);font-weight:700}
.sigbox input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;font:500 17px Inter,-apple-system,sans-serif;padding:12px 13px;margin:8px 0 4px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.sigbox input[type=text]:focus{border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 15%,transparent)}
.preview{font-family:'Dancing Script',cursive;font-size:30px;color:#1b2f8a;min-height:40px;line-height:1.2}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin:10px 0 14px;cursor:pointer}.agree input{width:21px;height:21px;margin-top:0;flex:none;accent-color:var(--p)}
.accept{width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--p) 88%,white),var(--p));color:#fff;border:0;border-radius:14px;padding:15px;font:700 16px Inter,-apple-system,sans-serif;cursor:pointer;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 20px -8px var(--p);transition:transform .16s var(--ease),opacity .2s,box-shadow .2s}
.accept:active:not(:disabled){transform:scale(.97)}
.accept:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.err{color:#b3261e;font-size:13px;margin-top:6px;min-height:16px}
.done{border:1.5px solid #86d3a1;background:#f0faf3;border-radius:16px;padding:16px;animation:up .6s var(--ease) both}
.done .preview{color:#1b2f8a}.done small{display:block;color:#15803d;font-weight:700;font-size:13px;margin-top:4px}
.ksig{border-top:1px solid #333;padding-top:6px;font-size:12.5px;color:#6b7079}
.ksig .preview{font-size:24px;color:#333}
.stamp{display:inline-block;background:#16a34a;color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;padding:5px 11px;border-radius:99px;margin-left:8px;vertical-align:middle}
.foot{text-align:center;font-size:12px;color:#8a9099;margin:-22px 0 30px}
#cta{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translate(-50%,0);z-index:6;border:0;border-radius:99px;padding:13px 20px;background:var(--p);color:#fff;
  font:700 14.5px Inter,-apple-system,sans-serif;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);cursor:pointer;transition:transform .35s var(--ease),opacity .35s;white-space:nowrap}
#cta.off{opacity:0;transform:translate(-50%,24px);pointer-events:none}
@media(max-width:640px){.paper{padding:22px 16px;margin:10px 8px 30px;border-radius:16px;overflow-wrap:anywhere}td:last-child{width:38%}.tot{max-width:none}.grid,.sig{grid-template-columns:1fr}.top{flex-direction:column}.id{flex-direction:column;align-items:flex-start}.ct{overflow-wrap:normal}.qt{text-align:left}.biz{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff}.bar,.foot,.sigbox .agree,.accept,.err,#cta{display:none}.paper{box-shadow:none;border:0;margin:0;max-width:none;padding:.5in;animation:none}}
</style><link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20120%20120%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2226%22%20fill%3D%22%23222B45%22/%3E%3Cpath%20d%3D%22M33%2031a27%2023%200%200%201%2054%200z%22%20fill%3D%22%23E8913F%22/%3E%3Crect%20x%3D%2257.5%22%20y%3D%2210%22%20width%3D%225%22%20height%3D%2220%22%20rx%3D%222.5%22%20fill%3D%22%23C46F28%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2228%22%20width%3D%2276%22%20height%3D%2210%22%20rx%3D%225%22%20fill%3D%22%23E8913F%22/%3E%3Crect%20x%3D%2232%22%20y%3D%2238%22%20width%3D%2256%22%20height%3D%2274%22%20rx%3D%227%22%20fill%3D%22%23FFFFFF%22/%3E%3Crect%20x%3D%2238.5%22%20y%3D%2244%22%20width%3D%2243%22%20height%3D%2262%22%20rx%3D%224%22%20fill%3D%22%23EEF1F8%22/%3E%3Cpath%20d%3D%22M47%2069l9%209%2018-20%22%20fill%3D%22none%22%20stroke%3D%22%23E8913F%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Crect%20x%3D%2245%22%20y%3D%2286%22%20width%3D%2230%22%20height%3D%223.4%22%20rx%3D%221.7%22%20fill%3D%22%23B3B8CC%22/%3E%3Crect%20x%3D%2245%22%20y%3D%2294%22%20width%3D%2221%22%20height%3D%223.4%22%20rx%3D%221.7%22%20fill%3D%22%23B3B8CC%22/%3E%3C/svg%3E"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet"><style>
/* DuPage Quotes loading screen v2 – navy #222B45 + orange #E8913F */
#dq-load{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;
  background:radial-gradient(60% 45% at 50% 38%,rgba(232,145,63,.22) 0%,rgba(232,145,63,0) 70%),radial-gradient(120% 80% at 50% 120%,#141a2e 0%,transparent 60%),#222B45;
  font-family:Poppins,-apple-system,Helvetica,Arial,sans-serif;transition:opacity .6s cubic-bezier(.23,1,.32,1),visibility .6s,transform .6s cubic-bezier(.23,1,.32,1),filter .6s}
#dq-load:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;
  mask-image:radial-gradient(circle at 50% 42%,black 0%,transparent 65%);-webkit-mask-image:radial-gradient(circle at 50% 42%,black 0%,transparent 65%)}
#dq-load.hide{opacity:0;visibility:hidden;transform:scale(1.06);filter:blur(6px)}
#dq-load .tile{position:relative;width:124px;height:124px;border-radius:34px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 24px 60px -18px rgba(0,0,0,.6),0 0 80px -10px rgba(232,145,63,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:dqpop .8s cubic-bezier(.34,1.4,.64,1) both}
#dq-load .tile:after{content:"";position:absolute;inset:-2px;border-radius:36px;padding:2px;background:conic-gradient(from var(--dqa,0deg),transparent 0 70%,#E8913F 85%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:dqspin 1.6s linear infinite}
@property --dqa{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes dqspin{to{--dqa:360deg}}
#dq-load .lg{width:92px;height:92px;animation:dqfloat 3s ease-in-out .8s infinite}
#dq-load .wm{font-size:38px;font-weight:700;line-height:1;color:#fff;letter-spacing:-1px;margin-top:26px;animation:dqfade .7s .15s cubic-bezier(.23,1,.32,1) both}
#dq-load .wq{font-size:14px;font-weight:600;color:#E8913F;letter-spacing:.5em;margin:8px 0 0 .5em;animation:dqfade .7s .22s cubic-bezier(.23,1,.32,1) both}
#dq-load .tg{font-size:13px;margin-top:26px;font-family:-apple-system,Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:.01em;
  background:linear-gradient(90deg,#8d95b3 0%,#fff 50%,#8d95b3 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:dqfade .7s .3s cubic-bezier(.23,1,.32,1) both,dqshine 2.2s linear infinite}
#dq-load .lbar{display:none}
@keyframes dqshine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes dqpop{from{transform:scale(.6) translateY(10px);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
@keyframes dqfloat{50%{transform:translateY(-4px)}}
@keyframes dqfade{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){#dq-load *{animation:none!important}}
</style></head>
<body><div id="dq-load"><div class="tile"><div class="lg"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><path d="M33 31a27 23 0 0 1 54 0z" fill="#E8913F"/><rect x="57.5" y="10" width="5" height="20" rx="2.5" fill="#C46F28"/><rect x="22" y="28" width="76" height="10" rx="5" fill="#E8913F"/><rect x="32" y="38" width="56" height="74" rx="7" fill="#FFFFFF"/><rect x="38.5" y="44" width="43" height="62" rx="4" fill="#EEF1F8"/><path d="M47 69l9 9 18-20" fill="none" stroke="#E8913F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="45" y="86" width="30" height="3.4" rx="1.7" fill="#B3B8CC"/><rect x="45" y="94" width="21" height="3.4" rx="1.7" fill="#B3B8CC"/></svg></div></div><div class="wm">DuPage</div><div class="wq">QUOTES</div><div class="tg">Loading your quote…</div></div>
<div class="bar"><span id="barTxt"></span><button onclick="window.print()" id="printBtn"></button></div>
<div class="paper" id="paper"></div>
<div class="foot">Quote prepared by DuPage Quotes for the contractor above · dupagequotes@gmail.com</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbyhZMVpTW09drWGodTUBtjCvWqbxEt29fpmDgbzyaaY91habK3yg_oRDaRf8U9Ehyyi/exec";
const P = new URLSearchParams(location.search);
async function api(params){ const r = await fetch(API + '?' + new URLSearchParams(params), {credentials:'omit'}); return r.json(); }
function hideLoad(){ const l=document.getElementById('dq-load'); if(l){ l.classList.add('hide'); setTimeout(()=>l.remove(),650); } }
function fail(msg){ hideLoad(); document.body.innerHTML = '<div style="font-family:-apple-system,Helvetica,Arial;max-width:520px;margin:60px auto;padding:0 20px;color:#333"><h2>DuPage Quotes</h2><p>'+msg+'</p></div>'; }
(async()=>{
const j = await api({api:'quote', q:P.get('q')||'', t:P.get('t')||''});
if(!j.ok){ fail(j.error||'This quote link is not valid. Please contact your contractor.'); return; }
const D = j.data; document.title = 'Quote ' + D.quote_no + ' – ' + D.contractor;


const TH = {Classic:{p:'#234E3A',a:'#C8892B',s:'#F3F6F4',f:"Georgia,'Times New Roman',serif"},
            Modern:{p:'#1B2A41',a:'#F26B21',s:'#F4F6FA',f:"-apple-system,Helvetica,Arial,sans-serif"},
            Simple:{p:'#0F7C80',a:'#0F7C80',s:'#F2F8F8',f:"-apple-system,Helvetica,Arial,sans-serif"}};
const T = {English:{quote:'QUOTE',no:'No.',date:'Date',valid:'Valid for 30 days',prep:'Prepared for',proj:'Project',start:'Planned start',scope:'Scope of work',det:'Details',total:'Total price',dep:'Deposit due to schedule',bal:'Balance due on completion',pay:'Payment',paytxt:'Deposit reserves your start date; balance due the day the work is completed. Any changes to the scope will be agreed in writing before work begins.',inc:'Included',notes:'Notes',
  sigT:'Client signature – type your full name',ph:'Your full name',agree:'I accept this quote, the price and the payment terms above.',btn:'Accept quote',acc:'Accepted',accBy:'Accepted electronically',kT:'Contractor',print:'Download / print',bar:'Review your quote below, then sign at the bottom.',need:'Please type your full name and check the box.',thanks:'Thank you! Your contractor has been notified.',signedOn:'on'},
 Spanish:{quote:'COTIZACIÓN',no:'No.',date:'Fecha',valid:'Válida por 30 días',prep:'Preparada para',proj:'Proyecto',start:'Inicio planeado',scope:'Trabajo a realizar',det:'Detalles',total:'Precio total',dep:'Depósito para agendar',bal:'Saldo al terminar el trabajo',pay:'Pago',paytxt:'El depósito reserva su fecha de inicio; el saldo se paga el día que se termina el trabajo. Cualquier cambio al trabajo se acordará por escrito antes de empezar.',inc:'Incluido',notes:'Notas',
  sigT:'Firma del cliente – escriba su nombre completo',ph:'Su nombre completo',agree:'Acepto esta cotización, el precio y las condiciones de pago.',btn:'Aceptar cotización',acc:'Aceptada',accBy:'Aceptada electrónicamente',kT:'Contratista',print:'Descargar / imprimir',bar:'Revise su cotización y firme abajo.',need:'Escriba su nombre completo y marque la casilla.',thanks:'¡Gracias! Su contratista ya fue avisado.',signedOn:'el'}};
const th = D.theme || TH[D.style] || TH.Classic, L = Object.assign({}, T[D.language] || T.English, D.doc_title ? {quote: D.doc_title} : {}); if (D.doc_title && (D.language||'English')==='English') { const w=D.doc_title.toLowerCase(); L.btn='Accept '+w; L.agree='I accept this '+w+', the price and the payment terms above.'; L.bar='Review your '+w+' below, then sign at the bottom.'; }
const r = document.documentElement.style; r.setProperty('--p',th.p); r.setProperty('--a',th.a); r.setProperty('--s',th.s); r.setProperty('--f',th.f);
const e = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m = x => '$'+Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById('barTxt').textContent = L.bar; document.getElementById('printBtn').textContent = L.print;
const c = D.client||{}, dep = Number(D.deposit_pct||0), price = Number(D.price);
const initials = (D.contractor.match(/[A-Za-z]+/g)||['Q']).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const items = D.items.map(i=>`<tr><td><b>${e(i.title)}</b>${i.description?'<br>'+e(i.description):''}</td><td>${e(i.detail || (i.amount!=null&&i.amount!==''?m(i.amount):L.inc))}</td></tr>`).join('');
function sigBlock(){
  if (D.status==='Accepted') return `<div class="done"><label class="t" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#2E7D4F;font-weight:700">${L.accBy}</label><div class="preview">${e(D.accepted_name)}</div><small>✓ ${L.acc} ${L.signedOn} ${e(D.accepted_at)}</small></div>`;
  return `<div class="sigbox"><label class="t" for="nm">${L.sigT}</label>
  <input type="text" id="nm" placeholder="${L.ph}" autocomplete="name" maxlength="80" value="">
  <div class="preview" id="pv"></div>
  <label class="agree"><input type="checkbox" id="ag"><span>${L.agree}</span></label>
  <button class="accept" id="go" disabled>${L.btn}</button><div class="err" id="err"></div></div>`;
}
function render(){
  document.getElementById('paper').innerHTML = `
  <div class="top"><div class="id">${D.logo?`<img class="logo" src="${D.logo}">`:`<div class="badge">${initials}</div>`}<div><div class="biz">${e(D.contractor)}</div><div class="ct">${[D.phone,D.email].filter(Boolean).map(e).join(' · ')}</div></div></div>
  <div class="qt"><b>${L.quote}</b>${L.no} ${e(D.quote_no)}<br>${L.date}: ${e(D.date)}<br>${L.valid}${D.status==='Accepted'?`<br><span class="stamp">✓ ${L.acc.toUpperCase()}</span>`:''}</div></div>
  <div class="grid"><div><h4>${L.prep}</h4><b>${e(c.name)}</b><br>${e(c.address)}${c.city?'<br>'+e(c.city):''}</div>
  <div><h4>${L.proj}</h4>${e(D.project)}${D.start?'<br>'+L.start+': '+e(D.start):''}</div></div>
  <table><tr><th>${L.scope}</th><th>${L.det}</th></tr>${items}</table>
  <div class="tot"><div class="big"><span>${L.total}</span><span>${m(price)}</span></div>
  ${dep?`<div><span>${L.dep} (${dep}%)</span><span>${m(price*dep/100)}</span></div><div><span>${L.bal}</span><span>${m(price-price*dep/100)}</span></div>`:''}</div>
  ${(D.payment||dep)?`<div class="terms"><b>${L.pay}:</b> ${D.payment?e(D.payment)+'. ':''}${dep?L.paytxt:''}</div>`:''}
  ${D.notes?`<div class="terms"><b>${L.notes}:</b> ${e(D.notes)}</div>`:''}
  <div class="sig">${sigBlock()}<div class="ksig"><div class="preview">${e(D.contact && !/owner/i.test(D.contact)?D.contact:'')}</div>${e(D.contact && !/owner/i.test(D.contact)?D.contact+', ':'')}${e(D.contractor)} · ${L.kT}</div></div>`;
  const nm=document.getElementById('nm'); if(!nm) return;
  const ag=document.getElementById('ag'), go=document.getElementById('go'), pv=document.getElementById('pv'), er=document.getElementById('err');
  const upd=()=>{pv.textContent=nm.value; go.disabled=!(nm.value.trim().length>=3 && ag.checked); er.textContent='';};
  nm.oninput=upd; ag.onchange=upd;
  go.onclick=()=>{ if(go.disabled){er.textContent=L.need;return;} go.disabled=true; go.textContent='…';
    const ok=res=>{const cb=document.getElementById('cta'); if(cb) cb.remove(); D.status='Accepted'; D.accepted_name=res.name||nm.value; D.accepted_at=res.at||''; render(); const n=document.createElement('p'); n.style.cssText='color:#2E7D4F;font-weight:700;margin:12px 0 0'; n.textContent=L.thanks; document.querySelector('.done').appendChild(n);};
    const bad=err=>{go.disabled=false; go.textContent=L.btn; er.textContent=(err&&err.message)||L.need;};
    fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'accept',q:D.quote_no,t:D.token,name:nm.value,agreed:ag.checked})}).then(r=>r.json()).then(j=>j.ok?ok(j):bad({message:j.error})).catch(()=>bad({message:L.need}));
  };
}
render();
// floating "accept" button on phones until the signature box is on screen
(()=>{ if (D.status==='Accepted') return; const b=document.createElement('button'); b.id='cta'; b.textContent = (L.btn||'Accept') + ' ↓'; document.body.appendChild(b);
  b.onclick=()=>{ const s=document.querySelector('.sig'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); };
  const s=document.querySelector('.sig'); if(!s||!window.IntersectionObserver) return;
  new IntersectionObserver(([x])=>b.classList.toggle('off', x.isIntersecting || D.status==='Accepted'),{threshold:.2}).observe(s); })();

hideLoad();
})();
</script>
</body></html>
